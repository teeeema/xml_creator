    {
      "rule_id": "P.DS.01.MSG.005.R001",
      "requirement_code": 1,
      "source_text": "при формировании электронного сообщения применяется следующее правило: в электронное сообщение должно быть включено по одному экземпляру сложного реквизита «Сведения из отчета о зачислении и распределении сумм ввозных таможенных пошлин» (ds01cdo:ChargedDistributedDutyReportDetails) на каждый месяц, сведения которого были ранее направлены, начиная с месяца, в сведения которого вносятся изменения",
      "source_refs": [
        {
          "source_id": "49OP-P.DS.01.MSG.005-R001",
