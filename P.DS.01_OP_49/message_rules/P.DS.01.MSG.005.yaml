      "requirement_code": 2,
      "source_text": "в электронном сообщении должны отсутствовать реквизиты «Сведения из отчета о зачислении и распределении сумм ввозных таможенных пошлин» (ds01cdo:ChargedDistributedDutyReportDetails), совпадающие по значению элемента «Дата отчета» (csdo:EventDate)",
