      "requirement_code": 4,
      "source_text": "для всех действующих записей, содержащихся в информационной базе, и соответствующих реквизиту «Сведения из отчета о зачислении и распределении сумм ввозных таможенных пошлин» (ds01cdo:ChargedDistributedDutyReportDetails) значение реквизита «Дата отчета» (csdo:EventDate) больше или равно минимальному значению реквизита «Дата отчета» (csdo:EventDate) выбранному из всех реквизитов «Сведения из отчета о зачислении и распределении сумм ввозных таможенных пошлин» (ds01cdo:ChargedDistributedDutyReportDetails), входящих в электронное сообщение, в электронном сообщении должен содержаться реквизит «Сведения из отчета о зачислении и распределении сумм ввозных таможенных пошлин» (ds01cdo:ChargedDistributedDutyReportDetails), совпадающий по значению ключевых реквизитов «Дата отчета» (csdo:EventDate) и «Код страны, предоставившей информацию» (ds01sdo:ReportCountryCode)",
