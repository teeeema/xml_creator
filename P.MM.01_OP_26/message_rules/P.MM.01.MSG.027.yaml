      "condition": "если реквизит «Код вида документа регистрационного досье на лекарственный препарат» (hcsdo:DrugRegistrationDocCode) заполнен, то соответствует одному из значений: 02002 - инструкция по медицинскому применению лекарственного препарата; Код требования Формулировка требования 02010 - общая характеристика лекарственного препарата, утвержденная уполномоченным органом страны-производителя или страны – держателя регистрационного удостоверения; 02005 - макет первичной (внутренней) упаковки лекарственного препарата; 02004 - макет вторичной (потребительской) упаковки лекарственного препарата; 02006 - макет промежуточной упаковки лекарственного препарата; 07004 - план управления рисками на лекарственный препарат; 13028 - проект нормативного документа по качеству для лекарственного препарата, подготовленный в соответствии с рекомендациями Евразийской экономической комиссии",
