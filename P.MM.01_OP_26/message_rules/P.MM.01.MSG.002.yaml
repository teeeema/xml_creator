ти растительного ингредиента лекарственного препарата» (hcsdo:DegreeRefinementRawMaterialName) заполняется обязательно 57. если реквизит «Код статуса орфанного лекарственного препарата» (hcsdo:OrphanDrugCode) заполнен, то соответствует одному из значений: 01 - присвоен статус орфанного; 02 - не присвоен статус орфанного; 03 - в процессе рассмотрения 58. если реквизит «Адрес» (ccdo:AddressV4Details) в составе любых сложных реквизитов заполнен, то в его составе реквизит «Код страны» (csdo:UnifiedCountryCode) заполняется обязательно 59. если реквизит «Адрес» (ccdo:AddressV4Details) в составе любых сложных реквизитов заполнен, то в его составе реквизит «Код вида адреса» (csdo:AddressKindCode) заполняется обязательно 60. если реквизит «Адрес» (ccdo:AddressV4Details) в составе любых сложных реквизитов заполнен, то в его составе должен быть заполнен реквизит «Город» (csdo:CityName) или реквизит «Населенный пункт» (csdo:SettlementName) 61. если реквизит «Адрес» (ccdo:SubjectAddressDetails) в составе любых сложных реквизитов заполнен, то реквизит «Улица» (csdo:StreetName) в его составе заполняется обязательно 62. если реквизит «Контактный реквизит» (ccdo:CommunicationDetails) в составе любых сложных реквизитов заполнен, то в его составе должен быть заполнен реквизит «Код вида связи» (csdo:CommunicationChannelCode) или реквизит «Наименование вида Код требования Формулировка требования связи» (csdo:CommunicationChannelName) 63. если реквизит «Код вида связи» (csdo:CommunicationChannelCode) заполнен, то его значение должно соответствовать одному из следующих значений: AO – «адрес сайта в сети Интернет»; TE – «телефон»; EM – «электронная почта»; FX – «телефакс» 64. если реквизит «Сведения о наименовании лекарственного препарата (средства)» (hccdo:DrugNameDetails) заполнен, то в его составе должен быть заполнен реквизит «Код наименования активной фармацевтической субстанции» (hcsdo:DrugCode) или реквизит «Наименование активной фармацевтической субстанции» (hcsdo:DrugName) 65. если реквизит «Сведения об активной фармацевтической субстанции в составе лекарственного препарата» (hccdo:ActiveSubstanceDetails) заполнен, то в его составе должен быть заполнен реквизит «Код активной фармацевтической субстанции» (hcsdo:ActiveSubstanceCode) или «Наименование активной фармацевтической субстанции» (hcsdo:ActiveSubstanceName) 66. если реквизит Код функции в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleCode) заполнен, то соответствует одному из значений: 01 - действующее вещество; 02 - вспомогательное вещество; 03 - реагент 67. если значение реквизита «Код функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleCode) или реквизита «Наименование функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleName) соответствует значению «действующее вещество», то в составе сложного реквизита «Сведения об ингредиенте, входящем в состав лекарственного препарата» (hccdo:DrugSubstanceDetails) должен быть заполнен реквизит «Сведения об активной фармацевтической субстанции в составе лекарственного препарата» (hccdo:Active SubstanceDetails) 68. если значение реквизита «Код функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleCode) или реквизита «Наименование функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleName) соответствует значению «действующее вещество», то в составе Код требования Формулировка требования сложного реквизита «Сведения об ингредиенте, входящем в состав лекарственного препарата» (hccdo:DrugSubstanceDetails) реквизиты «Сведения о вспомогательном веществе в составе лекарственного препарата» (hccdo:AuxiliarySubstanceDetails) и «Наименование реагента, входящего в состав лекарственного препарата» (hcsdo:ReagentName) не заполняются 69. если значение реквизита «Код функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleCode) или реквизита «Наименование функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleName) соответствует значению «вспомогательное вещество», то в составе сложного реквизита «Сведения об ингредиенте, входящем в состав лекарственного препарата» (hccdo:DrugSubstanceDetails) должен быть заполнен реквизит «Сведения о вспомогательном веществе в составе лекарственного препарата» (hccdo:AuxiliarySubstanceDetails) 70. если значение реквизита «Код функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleCode) или реквизита «Наименование функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleName) соответствует значению «вспомогательное вещество», то в составе сложного реквизита «Сведения об ингредиенте, входящем в состав лекарственного препарата» (hccdo:DrugSubstanceDetails) реквизиты «Сведения об активной фармацевтической субстанции в составе лекарственного препарата» (hccdo:ActiveSubstanceDetails) и «Наименование реагента, входящего в состав лекарственного препарата» (hcsdo:ReagentName) не заполняются 71. если значение реквизита «Код функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleCode) или реквизита «Наименование функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleName) соответствует значению «реагент», то в составе реквизита «Сведения об ингредиенте, входящем в состав лекарственного препарата» (hccdo:DrugSubstanceDetails) должен быть заполнен реквизит «Наименование реагента, входящего в состав лекарственного препарата» (hcsdo:ReagentName) 72. если значение реквизита «Код функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleCode) или реквизита «Наименование функции ингредиента в составе лекарственного препарата» (hcsdo:DrugSubstanceRoleName) Код требования Формулировка требования соответствует значению «реагент», то в составе сложного реквизита «Сведения об ингредиенте, входящем в состав лекарственного препарата» (hccdo:DrugSubstanceDetails) реквизиты «Сведения об активной фармацевтической субстанции в составе лекарственного препарата» (hccdo:ActiveSubstanceDetails) и «Сведения о вспомогательном веществе в составе лекарственного препарата» (hccdo:Auxiliary SubstanceDetails) не заполняются 73. если реквизит «Сведения о вспомогательном веществе в составе лекарственного препарата» (hccdo:AuxiliarySubstanceDetails) заполнен, то в его составе должен быть заполнен реквизит «Код вспомогательного вещества, входящего в состав лекарственного препарата» (hcsdo:AuxiliarySubstanceCode) или «Наименование вспомогательного вещества, входящего в состав лекарственного препарата» (hcsdo:AuxiliarySubstanceName) 74. если реквизит «Сведения о вспомогательном веществе в составе лекарственного препарата» (hccdo:AuxiliarySubstanceDetails) заполнен, то в его составе должен быть заполнен реквизит «Код функционального назначения вспомогательного вещества» (hcsdo: FunctionalPurposeCode) или «Наименование функционального назначения вспомогательного вещества» (hcsdo:AuxiliarySubstance Name) 75. если реквизит «код типа величины дозировки (концентрации)» (атрибут SubstanceMeasureTypeCode) заполнен, то его значение должно соответствовать одному из следующих значений: 01 – указана точная величина дозировки; 02 – величина дозировки меньше либо равна указанному значению; 03 – величина дозировки больше либо равна указанному значению; 04 – величина дозировки меньше указанного значения; 05 – величина дозировки больше указанного значения 76. если реквизит «Сведения о единице дозирования состава лекарственного препарата» (hccdo:DrugDosageUnitDetails) заполнен, то в его составе должен быть заполнен реквизит «Код вида единицы выражения состава лекарственного препарата» (hcsdo:DrugDosageUnit KindCode) или реквизит «Наименование вида единицы выражения состава лекарственного препарата» (hcsdo:DosageUnitKindName) Код требования Формулировка требования 77. если реквизит «Код вида единицы выражения состава лекарственного препарата» (hcsdo:DrugDosageUnitKindCode) заполнен, то его значение должно соответствовать одному из следующих значений: 01 – дозировка указана на единицу лекарственной формы; 02 – дозировка указана на единицу дозирования; 03 – дозировка указана на единицу массы; 04 – дозировка указана на единицу объема; 05 – дозировка указана на общее количество лекарственного средства в первичной упаковке; 06 – дозировка указана на единицу объема после растворения; 07 – дозировка указана на единицу объема перед разведением; 08 – дозировка указана на единицу времени; 09 – дозировка указана на единицу лекарственной формы, совпадающую с единицей дозирования 78. если реквизит «Сведения о производителе» (hccdo:ManufacturingAuthorizationHolderV2Details) заполнен, то в его составе должен быть заполнен реквизит «Наименование хозяйствующего субъекта» (csdo:BusinessEntityName) и (или) реквизит «Краткое наименование хозяйствующего субъекта» (csdo:BusinessEntityBriefName) 79. если реквизит «Сведения о держателе (заявителе) регистрационного удостоверения» (hccdo:RegistrationCertificateHolderDetails) заполнен, то в его составе должен быть заполнен реквизит «Код страны» (csdo:UnifiedCountryCode) 80. если реквизит «Сведения о держателе (заявителе) регистрационного удостоверения» (hccdo:RegistrationCertificateHolderDetails) заполнен, то в его составе должен быть заполнен реквизит «Наименование хозяйствующего субъекта» (csdo:BusinessEntityName) и (или) реквизит «Краткое наименование хозяйствующего субъекта» (csdo:BusinessEntityBriefName) 81. в составе сложного реквизита «Сведения о производителе» (hccdo:ManufacturingAuthorizationHolder V2Details) должен быть заполнен реквизит «Код организационно-правовой формы» (csdo:BusinessEntityTypeCode) или реквизит «Наименование организационно-правовой формы» (csdo:BusinessEntityTypeName) 82. в составе сложного реквизита «Сведения об упакованной единице лекарственного препарата» (hccdo:PackageDetails) должен быть заполнен реквизит «Код вида первичной упаковки лекарственного препарата» (hcsdo:DrugPackageKindCode) или реквизит «Наименование вида первичной упак