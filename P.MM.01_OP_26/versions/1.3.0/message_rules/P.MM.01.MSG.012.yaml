    {
      "source_requirement_code": "4",
      "source_regulation_table_index": 195,
      "requirement": "реквизит «Код вида документа регистрационного досье на лекарственный препарат» (hcsdo:DrugRegistrationDocCode) должен содержать кодовое обозначение вида документа из классификатора видов документов регистрационного досье лекарственного препарата, указанного в разделе VII Правил информационного взаимодействия, а атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе этого реквизита должен содержать значение «2058». Вид документа должен соответствовать значению «заявление о процедуре регистрации, оформленное в соответствии с приложением № 2 к Правилам регистрации» и может принимать следующие значения:01002 – заявление о регистрации лекарственного препарата для медицинского применения (приведении регистрационного досье лекарственного препарата в соответствие с требованиями Евразийского экономического союза);01003 – заявление о внесении изменений в регистрационное досье лекарственного препарата;01004 – заявление о перерегистрации лекарственного препарата",
