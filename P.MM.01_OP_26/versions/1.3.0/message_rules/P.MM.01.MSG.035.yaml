{
  "message_code": "P.MM.01.MSG.035",
  "structure_id": "R.HC.MM.01.006",
  "business_rules": [
    {
      "source_requirement_code": "1",
      "source_regulation_table_index": 173,
      "requirement": "в единой базе данных должна содержаться запись, в которой реквизит «Конечная дата и время» (csdo:EndDateTime) в составе сложного реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) не заполнен, значение реквизитов «Номер заявления о регистрации лекарственного препарата» (hcsdo:ApplicationId) и «Код страны» (csdo:UnifiedCountryCode) в составе сложного реквизита «Сведения о рассмотрении заявления и (или) регистрационного досье» (hccdo:DrugApprovalApplicationDetails) совпадает с переданными в сообщении, а значение реквизита «Начальная дата и время» (csdo:StartDateTime) в составе сложного реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) раньше чем в сообщении",
      "field_paths": [],
      "interpretation_status": "NOT_EXECUTABLE_SOURCE_TEXT",
      "source_refs": [
        {
          "source_id": "SRC-PMM01-77",
