    {
      "source_requirement_code": "3",
      "source_regulation_table_index": 171,
      "requirement": "реквизит «Номер заявления о регистрации лекарственного препарата» (hcsdo:ApplicationId) не должен быть заполнен, если выполнено следующее условие:Направление от уполномоченного органа референтного государства в Комиссию первого сообщения о поступлении нового заявления. Сообщение направляется с целью получения номера заявления уполномоченным органом референтного государства. В такой ситуации реквизит «Номер заявления о регистрации лекарственного препарата» (hcsdo:ApplicationId) не заполняется, при этом:а) реквизит «Код этапа рассмотрения заявления на регистрацию лекарственного препарата» (hcsdo:ApplicationStatusCode) должен соответствовать значению «01 – прием заявления»;б) код страны уполномоченного органа, направившего сообщение, должен соответствовать реквизиту «Код страны» (csdo:UnifiedCountryCode) в составе того же экземпляра реквизита «Сведения о регистрации» (hccdo:CountryDrugRegistrationDetails), в котором реквизит «Код роли государства-члена» (hcsdo:CountryKindCode), соответствует значению «01 – референтное государство».",
