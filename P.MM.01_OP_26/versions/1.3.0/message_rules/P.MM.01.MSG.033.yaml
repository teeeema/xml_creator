    {
      "source_requirement_code": "4",
      "source_regulation_table_index": 171,
      "requirement": "реквизит «Номер заявления о регистрации лекарственного препарата» (hcsdo:ApplicationId) не должен быть заполнен, если выполнено следующее условие:Направление от уполномоченного органа государства признания в Комиссию первого сообщения о поступлении нового заявления о внесении изменений в регистрационное досье зарегистрированного лекарственного препарата уполномоченным органом государства признания без привлечения уполномоченного органа референтного государства в случаях, предусмотренных Правилами регистрации (пункт 2.1.5 Приложения № 19 Правил регистрации в редакции Решения Совета Комиссии от 29 мая 2024 г. № 43). Сообщение направляется с целью получения номера заявления уполномоченным органом государства признания. В такой ситуации реквизит «Номер заявления о регистрации лекарственного препарата» (hcsdo:ApplicationId) не заполняется, при этом:а) реквизит «Код этапа рассмотрения заявления на регистрацию лекарственного препарата» (hcsdo:ApplicationStatusCode) должен соответствовать значению «01 – прием заявления»;б) код страны уполномоченного органа, направившего сообщение, должен соответствовать реквизиту «Код страны» (csdo:UnifiedCountryCode) в составе того же экземпляра реквизита «Сведения о регистрации» (hccdo:CountryDrugRegistrationDetails), в котором реквизит «Код роли государства-члена» (hcsdo:CountryKindCode), соответствует значению «02 – государство признания»;в) реквизит «Код вида документа регистрационного досье на лекарственный препарат» (hcsdo:DrugRegistrationDocCode) в составе сложного реквизита «Сведения о документе регистрационного досье (дела)» (hccdo:RegistrationDossierDocDetails) должен соответствовать значению «01003 – заявление о внесении изменений в регистрационное досье лекарственного препарата»",
