      "requirement": "если реквизит «Код вида документа регистрационного досье на лекарственный препарат» (hcsdo:DrugRegistrationDocCode) в составе сложного реквизита «Сведения о документе регистрационного досье (дела)» (hccdo:RegistrationDossierDocDetails) соответствует значению «01003 – заявление о внесении изменений в регистрационное досье лекарственного препарата» или значению «01004 – заявление о перерегистрации лекарственного препарата», то реквизит «Порядковый номер регистрационного удостоверения лекарственного препарата» (hcsdo:RegistrationNumberId) должен быть заполнен и должен содержаться в актуальной записи единого реестра, при этом код страны уполномоченного органа, направившего сообщение, должен соответствовать коду государства-члена уполномоченного органа, представившего актуальную запись в единый реестр",
