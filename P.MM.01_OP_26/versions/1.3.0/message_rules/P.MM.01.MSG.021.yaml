      "source_requirement_code": "4",
      "source_regulation_table_index": 200,
      "requirement": "реквизит «Код вида документа регистрационного дела на лекарственный препарат» (hcsdo:DrugRegistrationFileCode) должен содержать кодовое обозначение вида документа из классификатора видов документов регистрационного дела лекарственного препарата, указанного в разделе VII Правил информационного взаимодействия, а атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе этого реквизита должен содержать значение «2040». Вид документа должен соответствовать значению «экспертный отчет об оценке безопасности, эффективности и качества» и может иметь значения:0207 – экспертный отчет об оценке безопасности, эффективности и качества;0401 – экспертный отчет об оценке безопасности, эффективности и качества",
