    {
      "source_requirement_code": "1",
      "source_regulation_table_index": 152,
      "requirement": "в едином реестре должна содержаться запись, в которой реквизит «Конечная дата и время» (csdo:EndDateTime) в составе сложного реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) не заполнен, значения реквизитов «Порядковый номер регистрационного удостоверения лекарственного препарата» (hcsdo:RegistrationNumberId) и «Код страны» (csdo:UnifiedCountryCode) в составе реквизита «Сведения о регистрации лекарственного препарата в государстве-члене» (hccdo:DrugCountryRegistrationDetails) совпадают с переданными в сообщении, а значение реквизита «Начальная дата и время» (csdo:StartDateTime) в составе сложного реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) раньше чем в сообщении",
      "field_paths": [],
      "interpretation_status": "NOT_EXECUTABLE_SOURCE_TEXT",
