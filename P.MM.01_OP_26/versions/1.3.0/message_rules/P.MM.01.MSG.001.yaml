      "source_requirement_code": "13",
      "source_regulation_table_index": 151,
      "requirement": "если реквизит «Код причины приостановки действия регистрационного удостоверения» (hcsdo:CertificatePauseCode) заполнен, то он должен соответствовать одному из значений:01 – имеются документально подтвержденные факты несоответствия качественного и количественного состава выпущенных серий лекарственного препарата заявленному составу;02 – лекарственный препарат является опасным (наносит серьезный или непоправимый вред здоровью человека);03 – доказано неблагоприятное соотношение \"польза - риск\" или выявлена документально подтвержденная недостаточная терапевтическая эффективность лекарственного препарата при соблюдении условий его применения, описанных в утвержденной ОХЛП;04 – не подтверждено положительное соотношение \"польза - риск\" при переоценке соотношения \"польза - риск\", проводимой ежегодно уполномоченным органом (экспертной организацией);05 – в регистрационном досье содержатся недостоверные документы и данные;06 – производитель не устранил выявленные во время инспекции несоответствия производства и методов контроля, заявленные в регистрационном досье, в согласованные с уполномоченным органом (экспертной организацией) сроки;07 – не выполнены обязательства по фармаконадзору держателем регистрационного удостоверения;08 – держателем регистрационного удостоверения не выполнены дополнительные требования, установленные уполномоченным органом (экспертной организацией);09 – отсутствие действующего документа, подтверждающего соответствие производственной площадки (площадок) требованиям надлежащей производственной практики Союза для лекарственного препарата;99 – другое",
