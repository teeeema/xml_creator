      "source_regulation_table_index": 151,
      "requirement": "если реквизит «Код вида особого условия регистрации лекарственного препарата» (hcsdo:DrugUsageRestrictionKindCode) заполнен, то он должен соответствовать одному из значений:01 – включение определенных мер для обеспечения безопасного применения лекарственного препарата в систему управления рисками;02 – проведение пострегистрационных исследований безопасности;03 – установление дополнительных требований к регистрации и подаче сообщений о подозреваемых нежелательных реакциях;04 – проведение пострегистрационных исследований эффективности, при необходимости исследования различных аспектов эффективности лекарственного препарата, которые не могут быть исследованы до начала реализации лекарственного препарата;05 – другие условия или ограничения в целях безопасного и эффективного применения лекарственного препарата",
