      "source_requirement_code": "10",
      "source_regulation_table_index": 203,
      "requirement": "реквизит «Код вида документа регистрационного дела на лекарственный препарат» (hcsdo:DrugRegistrationFileCode) может принимать следующие значения:0101 – запрос о предоставлении недостающей дополнительной информации, необходимых разъяснений или уточнений документов и данных, представленных в регистрационном досье лекарственного препарата;0102 – запрос государства признания в отношении документов регистрационного досье лекарственного препарата;0103 – замечания к регистрационному досье лекарственного препарата от государства признания;0104 – ответ на запрос о предоставлении недостающей дополнительной информации, необходимых разъяснений или уточнений документов и данных, представленных в регистрационном досье лекарственного препарата;0105 – запрос о предоставлении копии мастер-файла системы фармаконадзора;0106 – ответ заявителя на запрос государства признания в отношении документов регистрационного досье лекарственного препарата;0107 – ответ заявителя на замечания от государства признания;0199 – другое;0299 – другое;0399 – другое;0403 – запрос уполномоченного органа (экспертной организации) государства признания, направленный в уполномоченный орган референтного государства;0405 – замечания государства признания в отношении заключительного экспертного отчета по качеству;0406 – предложение уполномоченного органа (экспертной организации) государства признания в отношении заключительного экспертного отчета по качеству, направленное в уполномоченный орган референтного государства;0499 – другое",
