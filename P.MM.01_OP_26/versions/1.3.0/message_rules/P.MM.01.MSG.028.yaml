      "source_regulation_table_index": 166,
      "requirement": "если реквизит «Код вида документа регистрационного досье на лекарственный препарат» (hcsdo:DrugRegistrationDocCode) заполнен, то его значение должно соответствовать коду из классификатора видов документов регистрационного досье лекарственного препарата, указанного в разделе VII Правил информационного взаимодействия, а атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе этого реквизита должен содержать значение «2058». Вид документа должен соответствовать значению «документ, подлежащий размещению в едином реестре» в соответствии с Порядком ведения единого реестра и может иметь нижеследующие значения:02002 – инструкция по медицинскому применению лекарственного препарата;02010 – общая характеристика лекарственного препарата;02005 – макет первичной упаковки лекарственного препарата;02004 – макет вторичной упаковки;02006 – макет промежуточной упаковки;07004 – план управления рисками;13028 – нормативный документ по качеству",
