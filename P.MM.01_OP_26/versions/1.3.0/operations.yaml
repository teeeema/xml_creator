    {
      "operation_code": "P.MM.01.OPR.002",
      "name": "прием и обработка сведений о препарате, включаемом в единый реестр",
      "participant_role": "Комиссия",
      "normative_rows": [
        [
          "3",
          "Исполнитель",
          "Комиссия"
        ],
        [
