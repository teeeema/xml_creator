  "business_rules": [
    {
      "rule_id": "P.SP.02.MSG.045.T63.REQ.1",
      "requirement_code": "1",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.045-T63-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 63",
          "status": "CONFIRMED",
          "page": 773,
          "table": "63",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.045.T63.REQ.2",
      "requirement_code": "2",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в информационных ресурсах национального патентного ведомства, содержащих сведения о заявках на ТЗ Союза, должна содержаться запись, в составе которой реквизит «Код статуса» (csdo:StatusCode) равен значению «01» – «новая заявка на ТЗ Союза» или «02» – «заявка на ТЗ Союза изменена», реквизит «Конечная дата и время» (csdo:EndDateTime) не заполнен и в составе которой совокупность значений реквизитов «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId), «Код статуса» (csdo:StatusCode) и «Начальная дата и время» (csdo:StartDateTime) совпадает с совокупностью значений соответствующих реквизитов в представляемых изменяемых сведениях о заявке на ТЗ Союза",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.045-T63-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 63",
          "status": "CONFIRMED",
          "page": 773,
          "table": "63",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.045.T63.REQ.3",
      "requirement_code": "3",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) реквизит «Конечная дата и время» (csdo:EndDateTime) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.045-T63-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 63",
          "status": "CONFIRMED",
          "page": 773,
          "table": "63",
          "version_context": "P.SP.02 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.045.T63.REQ.4",
      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значений, соответствующих видам документов: «Ходатайство о внесении изменений в заявку на регистрацию товарного знака, знака обслуживания Евразийского экономического союза в отношении заявленного обозначения, перечня товаров, адреса для ведения переписки, сведений о представителе заявителя, а также исправлений технического характера»; «Ходатайство о внесении изменений в заявку на регистрацию коллективного знака Евразийского экономического союза в отношении заявленного обозначения, перечня товаров, адреса для ведения переписки, сведений о представителе заявителя, устава (положения) коллективного знака Евразийского экономического союза, а также исправлений технического характера»; «Ходатайство о внесении в заявку на регистрацию товарного знака, знака обслуживания Евразийского экономического союза изменений, касающихся сведений о заявителе и связанных с передачей или переходом права на заявку на регистрацию товарного знака, знака обслуживания Евразийского экономического союза»; «Ходатайство о внесении изменения сведений о заявителе в заявку на регистрацию коллективного знака Евразийского экономического союза вследствие изменения наименования (фамилии, имени, отчества (при наличии)) или места нахождения (места жительства)» в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.045-T63-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 63",
          "status": "CONFIRMED",
          "page": 774,
          "table": "63",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.045.T63.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значений, соответствующих видам документов: «Ходатайство о внесении изменений в заявку на регистрацию товарного знака, знака обслуживания Евразийского экономического союза в отношении заявленного обозначения, перечня товаров, адреса для ведения переписки, сведений о представителе заявителя, а также исправлений технического характера»; «Ходатайство о внесении изменений в заявку на регистрацию коллективного знака Евразийского экономического союза в отношении заявленного обозначения, перечня товаров, адреса для ведения переписки, сведений о представителе заявителя, устава (положения) коллективного знака Евразийского экономического союза, а также исправлений технического характера»; «Ходатайство о внесении в заявку на регистрацию товарного знака, знака обслуживания Евразийского экономического союза изменений, касающихся сведений о заявителе и связанных с передачей или переходом права на заявку на регистрацию товарного знака, знака обслуживания Евразийского экономического союза»; «Ходатайство о внесении изменения сведений о заявителе в заявку на регистрацию коллективного знака Евразийского экономического союза вследствие изменения наименования (фамилии, имени, отчества (при наличии)) или места нахождения (места жительства)» реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению указанных видов документов",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.045-T63-5",
          "document": "ОП_22.pdf",
          "location": "Таблица 63",
          "status": "CONFIRMED",
          "page": 775,
          "table": "63",
          "version_context": "P.SP.02 1.0.0",
          "item": "5"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.045.T63.REQ.6_29",
      "requirement_code": "6-29",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "соответствуют требованиям 6-29 таблицы 44 настоящего Регламента, которые применяются при заполнении экземпляра реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) (значения кодов требований в таблице 44 и таблице 63 совпадают)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.045-T63-6-29",
