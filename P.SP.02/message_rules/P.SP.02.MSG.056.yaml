    },
    {
      "rule_id": "P.SP.02.MSG.056.T74.REQ.11",
      "requirement_code": "11",
      "applies_to_structure": "R.IP.SP.03.003",
      "source_text": "если в составе реквизита «Участник отношений в сфере регистрации и использования прав на объекты интеллектуальной собственности» (ipcdo:IPPartyDetails) значение реквизита «Код вида участника отношений в сфере регистрации и использования прав на объекты интеллектуальной собственности» (ipsdo:IPPartyKindCode) соответствует значению «AP» – «заявитель», то значение атрибута «код вида представления наименования» (атрибут nameRepresentationKindCode) в составе реквизита «Полное наименование субъекта c указанием вида представления сведений и кода языка (ipsdo:IPSubjectName) должно соответствовать значению «OR» – «сведения, представленные на исходном (оригинальном) языке», значение атрибута «код языка» (атрибут languageCode) должно соответствовать значению «RU»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
