{
  "message_code": "P.SP.02.MSG.028",
  "structure_id": "R.IP.SP.02.002",
  "fixed_values": {},
  "field_usage": {},
  "business_rules": [
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.1",
      "requirement_code": "1",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 714,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.2",
      "requirement_code": "2",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPEntityStatusDetails) значение реквизита «Код статуса» (csdo:StatusCode) должно соответствовать значению «01» – «новая заявка на ТЗ Союза», атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 714,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.3",
      "requirement_code": "3",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) должен быть заполнен. В информационных ресурсах национального патентного ведомства, содержащих сведения о заявках на ТЗ Союза, не должно содержаться записи, в составе которой значение реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) совпадает со значением реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) в составе сообщения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 714,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.4",
      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при включении в классификатор видов документов, сведений и материалов, используемых в сфере интеллектуальной собственности, утвержденный Решением Коллегии Комиссии от 27 июля 2021 г. № 92 (далее – классификатор видов документов, сведений и материалов), значения, соответствующего виду документа «Заявка на регистрацию товарного знака, знака обслуживания Евразийского экономического союза», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 715,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Заявка на регистрацию товарного знака, знака обслуживания Евразийского экономического союза», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению: «Заявка на регистрацию товарного знака, знака обслуживания Евразийского экономического союза»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-5",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 715,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "5"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.6",
      "requirement_code": "6",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Дата подачи заявки (ходатайства)» (ipsdo:ApplicationReceiptDate) должен быть заполнен в соответствии с ISO 8601",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-6",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 715,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "6"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.7",
      "requirement_code": "7",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "если реквизит «Код страны» (csdo:UnifiedCountryCode) заполнен в составе любых реквизитов, то значение атрибута «идентификатор справочника (классификатора)» (атрибут codeListId) в его составе должно соответствовать значению «ВОИС ST.3»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-7",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 715,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "7"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.8",
      "requirement_code": "8",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "если реквизит «Адрес» (ccdo:SubjectAddressDetails) заполнен в составе любых реквизитов, то должны быть заполнены реквизиты «Код вида адреса» (csdo:AddressKindCode)», «Код страны» (csdo:UnifiedCountryCode), «Город» (csdo:CityName), «Улица» (csdo:StreetName) и «Номер дома» (csdo:BuildingNumberId) в его составе",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-8",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 715,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "8"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.9",
      "requirement_code": "9",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "если реквизит «Контактный реквизит» (ccdo:CommunicationDetails) заполнен в составе любых реквизитов, то в его составе заполняются реквизиты «Код вида связи» (csdo:CommunicationChannelCode) и «Идентификатор канала связи» (csdo:CommunicationChannelId), а реквизит «Наименование вида связи» (csdo:CommunicationChannelName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-9",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 716,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "9"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.10",
      "requirement_code": "10",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "если реквизит «Контактный реквизит» (ccdo:CommunicationDetails) заполнен в составе любых реквизитов, то в его составе значение реквизита «Код вида связи» (csdo:CommunicationChannelCode) должно соответствовать одному из следующих значений: «TE», «EM» или «FX», в соответствии с перечнем видов средств (каналов) связи, утвержденным Решением Коллегии Комиссии от 6 декабря 2022 г. № 192",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-10",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 716,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "10"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.11",
      "requirement_code": "11",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Национальное патентное ведомство» (ipcdo:PatentAuthorityDetails) должен быть заполнен реквизит «Код страны» (csdo:UnifiedCountryCode)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-11",
          "document": "ОП_22.pdf",
          "location": "Таблица 44. Требования к заполнению реквизитов P.SP.02.MSG.028",
          "status": "CONFIRMED",
          "page": 716,
          "table": "44",
          "version_context": "P.SP.02 1.0.0",
          "item": "11"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.12",
      "requirement_code": "12",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Национальное патентное ведомство» (ipcdo:PatentAuthorityDetails) должен быть заполнен реквизит «Наименование уполномоченного органа» (csdo:AuthorityName) и должен быть заполнен реквизит «Адрес» (ccdo:SubjectAddressDetails), в составе которого значение реквизита «Код вида адреса» (csdo:AddressKindCode) должно соответствовать значению «2» – «фактический адрес (адрес места нахождения или места жительства)»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.028-T44-12",
