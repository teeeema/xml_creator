  "business_rules": [
    {
      "rule_id": "P.SP.02.MSG.051.T69.REQ.1",
      "requirement_code": "1",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "реквизит «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) должен быть заполнен. В информационных ресурсах ведомства подачи, содержащих сведения о ТЗ Союза, должна содержаться запись, у которой реквизит «Код статуса» (csdo:StatusCode) равен значению «01» – «ТЗ Союза зарегистрирован», «03» – «сведения о ТЗ Союза изменены», реквизит «Конечная дата и время» (csdo:EndDateTime) не заполнен, а значение реквизита «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) совпадает со значением реквизита «Регистрационный номер товарного знака Союза» в составе сообщения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.051-T69-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 69",
          "status": "CONFIRMED",
          "page": 790,
          "table": "69",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.051.T69.REQ.2",
      "requirement_code": "2",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.051-T69-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 69",
          "status": "CONFIRMED",
          "page": 790,
          "table": "69",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.051.T69.REQ.3",
      "requirement_code": "3",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значений, соответствующих видам документов «Решение о признании предоставления правовой охраны товарному знаку, знаку обслуживания Евразийского экономического союза недействительным» или «Решение о прекращении правовой охраны товарного знака, знака обслуживания Евразийского экономического союза», реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.051-T69-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 69",
          "status": "CONFIRMED",
          "page": 791,
          "table": "69",
          "version_context": "P.SP.02 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.051.T69.REQ.4",
      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значений, соответствующих видам документов «Решение о признании предоставления правовой охраны товарному знаку, знаку обслуживания Евразийского экономического союза недействительным» или «Решение о прекращении правовой охраны товарного знака, знака обслуживания Евразийского экономического союза», реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению «Решение о признании предоставления правовой охраны товарному знаку, знаку обслуживания Евразийского экономического союза недействительным» или «Решение о прекращении правовой охраны товарного знака, знака обслуживания Евразийского экономического союза»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.051-T69-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 69",
          "status": "CONFIRMED",
          "page": 791,
          "table": "69",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.051.T69.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в составе реквизита «Основание для аннулирования регистрации товарного знака Союза» (ipcdo:RegistrationCancellationDetails) должны быть заполнены реквизиты: «Код причины аннулирования регистрации товарного знака Союза» (ipsdo:CancellationTrademarkRegistrationReasonCode); «Решение суда (национального патентного ведомства)» (ipcdo:NationalPatentDecisionDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.051-T69-5",
          "document": "ОП_22.pdf",
          "location": "Таблица 69",
          "status": "CONFIRMED",
          "page": 791,
          "table": "69",
          "version_context": "P.SP.02 1.0.0",
          "item": "5"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.051.T69.REQ.6_19",
      "requirement_code": "6-19",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "соответствуют требованиям 6-19 таблицы 49 настоящего Регламента, которые применяются при заполнении экземпляра реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails) (значения кодов требований в таблице 49 и таблице 69 совпадают)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.051-T69-6-19",
