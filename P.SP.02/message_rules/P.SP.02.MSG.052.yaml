      "source_text": "в составе экземпляра реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), содержащего сведения об аннулировании регистрации ТЗ Союза, должен быть заполнен реквизит «Начальная дата и время» (csdo:StartDateTime), и значение реквизита «Начальная дата и время» (csdo:StartDateTime) в составе этого экземпляра сведений записи из состава информационных ресурсах национального патентного ведомства, содержащих сведения о ТЗ Союза, должно быть меньше, чем значение реквизита «Начальная дата и время» (csdo:StartDateTime) в составе экземпляра реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), содержащего сведения о регистрации нового ТЗ Союза",
