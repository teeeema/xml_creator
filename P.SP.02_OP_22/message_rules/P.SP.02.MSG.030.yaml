      "source_text": "реквизит «Сведения о доводах (замечаниях) заявителя» (ipcdo:ArgumentDetails) должен быть заполнен",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
