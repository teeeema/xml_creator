{
  "message_code": "P.SP.02.MSG.030",
  "structure_id": "R.IP.SP.02.002",
  "fixed_values": {},
  "field_usage": {},
  "business_rules": [
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.1",
      "requirement_code": "1",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 728,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.2",
      "requirement_code": "2",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Доводы и замечания заявителя в связи с уведомлением о результатах экспертизы заявки на товарный знак, знак обслуживания Евразийского экономического союза в отношении всех или части заявленных товаров», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 728,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.3",
      "requirement_code": "3",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Доводы и замечания заявителя в связи с уведомлением о результатах экспертизы заявки на товарный знак, знак обслуживания Евразийского экономического союза в отношении всех или части заявленных товаров», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению: «Доводы и замечания заявителя в связи с уведомлением о результатах экспертизы заявки на товарный знак, знак обслуживания Евразийского экономического союза в отношении всех или части заявленных товаров»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 729,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.4",
      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) должен быть заполнен. В информационных ресурсах национального патентного ведомства, содержащих сведения о заявках на ТЗ Союза, должна содержаться запись, у которой реквизит «Код статуса» (csdo:StatusCode) равен значению «02» – «заявка на ТЗ Союза изменена», реквизит «Конечная дата и время» (csdo:EndDateTime) не заполнен и в составе которой значение реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) совпадает со значением реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) в составе сообщения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 729,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Вид регистрации ТЗ» (ipsdo:TrademarkRegistrationCode) должен быть заполнен и иметь значение «02» – «решение (заключение) о регистрации товарного знака Союза в отношении части заявленных товаров (услуг)» или «03» – «решение (заключение) об отказе в регистрации товарного знака Союза»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-5",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 729,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "5"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.6_29",
      "requirement_code": "6-29",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "соответствуют требованиям 6-29 таблицы 44 настоящего Регламента, которые применяются при заполнении экземпляра реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) (значения кодов требований в таблице 44 и таблице 46 совпадают)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-6-29",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 729,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "6-29"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.30",
      "requirement_code": "30",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Товар в соответствии с МКТУ» (ipcdo:GoodsBaseDetails) должна быть одна или более записей для которых значение реквизита «Признак возможности регистрации товарного знака Союза» (ipsdo:TrademarkDecisionIndicator) соответствует значению «0» – «регистрация товарного знака Союза невозможна»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-30",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 729,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "30"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.31",
      "requirement_code": "31",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "для записей в составе реквизита «Товар в соответствии с МКТУ» (ipcdo:GoodsBaseDetails), для которых значение реквизита «Признак возможности регистрации товарного знака Союза» (ipsdo:TrademarkDecisionIndicator) соответствует значению «0» – «регистрация товарного знака Союза невозможна», должны быть заполнены реквизиты: «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId); «Описание основания для отказа в регистрации товарного знака Союза в отношении товара» (ipsdo:TrademarkRegRefusalReasonText)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-31",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 730,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "31"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.32",
      "requirement_code": "32",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Прилагаемый документ» (ipcdo:AccompanyingDocumentsDetails) должны быть заполнены реквизиты: «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName); «Номер документа» (csdo:DocId); «Дата документа» (csdo:DocCreationDate); «Описание» (csdo:DescriptionText); «Количество листов» (csdo:PageQuantity); «Документ в бинарном формате» (csdo:DocBinaryText)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-32",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 730,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "32"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.33",
      "requirement_code": "33",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Признак согласия на обработку представленных сведений» (ipsdo:ConsentToDataProcessingIndicator)) должен быть заполнен и его значение должно соответствовать одному из следующих значений: «1» – «согласие на обработку сведений представлено»; «0» – «согласие на обработку сведений не представлено»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-33",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 730,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "33"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.030.T46.REQ.34",
      "requirement_code": "34",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Сведения о подписании документа» (ipcdo:SignatureDetails) должен быть заполнен, и в его составе если реквизит «Сотрудник организации» (ipcdo:OfficerDetails) заполнен, то реквизит «ФИО» (ccdo:FullNameDetails), непосредственно подчиненный реквизиту «Сведения о подписании документа» (ipcdo:SignatureDetails), не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.030-T46-34",
          "document": "ОП_22.pdf",
          "location": "Таблица 46",
          "status": "CONFIRMED",
          "page": 730,
          "table": "46",
          "version_context": "P.SP.02 1.0.0",
          "item": "34"
        }
      ]
    },
    {
