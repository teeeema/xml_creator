    {
      "rule_id": "P.SP.02.MSG.039.T57.REQ.1",
      "requirement_code": "1",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.039-T57-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 57",
          "status": "CONFIRMED",
          "page": 757,
          "table": "57",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.039.T57.REQ.2",
      "requirement_code": "2",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Уведомление о прекращении делопроизводства по заявке на товарный знак, знак обслуживания Евразийского экономического союза в связи с преобразованием в национальную заявку», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.039-T57-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 57",
          "status": "CONFIRMED",
          "page": 757,
          "table": "57",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.039.T57.REQ.3",
      "requirement_code": "3",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Уведомление о прекращении делопроизводства по заявке на товарный знак, знак обслуживания Евразийского экономического союза в связи с преобразованием в национальную заявку», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению: «Уведомление о прекращении делопроизводства по заявке на товарный знак, знак обслуживания Евразийского экономического союза в связи с преобразованием в национальную заявку»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.039-T57-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 57",
          "status": "CONFIRMED",
          "page": 758,
          "table": "57",
          "version_context": "P.SP.02 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.039.T57.REQ.4",
      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) должен быть заполнен. В информационных ресурсах национального патентного ведомства, содержащих сведения о заявках на ТЗ Союза, должна содержаться запись, у которой реквизит «Код статуса» (csdo:StatusCode) равен значению «01» – «новая заявка на ТЗ Союза» или «02» – «заявка на ТЗ Союза изменена», реквизит «Конечная дата и время» (csdo:EndDateTime) не заполнен и в составе которой значение реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) совпадает со значением реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) в составе сообщения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.039-T57-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 57",
          "status": "CONFIRMED",
          "page": 758,
          "table": "57",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.039.T57.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPEntityStatusDetails) значение реквизита «Код статуса» (csdo:StatusCode) должно соответствовать значению «21» – «делопроизводство по заявке на ТЗ Союза прекращено», атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
