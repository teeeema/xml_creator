      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего одному из видов документа, приведённых ниже: «Решение о регистрации товарного знака, знака обслуживания Евразийского экономического союза в отношении всех заявленных товаров и (или) услуг»; «Решение о регистрации товарного знака, знака обслуживания Евразийского экономического союза в отношении части товаров и (или) услуг», реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать одному из приведённых ниже: «Решение о регистрации товарного знака, знака обслуживания Евразийского экономического союза в отношении всех заявленных товаров и (или) услуг»; «Решение о регистрации товарного знака, знака обслуживания Евразийского экономического союза в отношении части товаров и (или) услуг»",
