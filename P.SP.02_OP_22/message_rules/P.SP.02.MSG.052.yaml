      "requirement_code": "28",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "для экземпляра реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), содержащего сведения о регистрации нового ТЗ Союза, при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Решение о регистрации товарного знака, знака обслуживания Евразийского экономического союза в отношении всех заявленных товаров и (или) услуг», реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению «решение о регистрации товарного знака, знака обслуживания Евразийского экономического союза в отношении всех заявленных товаров и (или) услуг»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.052-T70-28",
          "document": "ОП_22.pdf",
          "location": "Таблица 70",
          "status": "CONFIRMED",
          "page": 797,
          "table": "70",
          "version_context": "P.SP.02 1.0.0",
          "item": "28"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.052.T70.REQ.29",
      "requirement_code": "29",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "реквизит «Сведения о подписании документа» (ipcdo:SignatureDetails) должен быть заполнен, и в его составе если реквизит «Сотрудник организации» (ipcdo:OfficerDetails) заполнен, то реквизит «ФИО» (ccdo:FullNameDetails), непосредственно подчиненный реквизиту «Сведения о подписании документа» (ipcdo:SignatureDetails), не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.052-T70-29",
          "document": "ОП_22.pdf",
          "location": "Таблица 70",
          "status": "CONFIRMED",
          "page": 797,
          "table": "70",
          "version_context": "P.SP.02 1.0.0",
          "item": "29"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.052.T70.REQ.30",
      "requirement_code": "30",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "если в составе реквизита «Сведения о подписании документа» (ipcdo:SignatureDetails) реквизит «ФИО» (ccdo:FullNameDetails), непосредственно подчиненный реквизиту «Сведения о подписании документа» (ipcdo:SignatureDetails), заполнен, то реквизит «Сотрудник организации» (ipcdo:OfficerDetails) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.052-T70-30",
          "document": "ОП_22.pdf",
          "location": "Таблица 70",
          "status": "CONFIRMED",
          "page": 797,
          "table": "70",
          "version_context": "P.SP.02 1.0.0",
          "item": "30"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.052.T70.REQ.31",
      "requirement_code": "31",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "если в составе реквизита «Сведения о подписании документа» (ipcdo:SignatureDetails) заполнен реквизит «Сотрудник организации» (ipcdo:OfficerDetails), в его составе должны быть заполнены реквизиты «Фамилия» (csdo:LastName), «Имя» (csdo:FirstName) и «Наименование должности» (csdo:PositionName), а реквизит «Контактный реквизит» (ccdo:CommunicationDetails) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
