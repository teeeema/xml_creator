  "business_rules": [
    {
      "rule_id": "P.SP.02.MSG.052.T70.REQ.1",
      "requirement_code": "1",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в электронном документе (сведениях) должны быть заполнены 1 или 2 экземпляра реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.052-T70-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 70",
          "status": "CONFIRMED",
          "page": 793,
          "table": "70",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.052.T70.REQ.2",
      "requirement_code": "2",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в электронном документе (сведениях) должен быть 1 экземпляр реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), в составе которого в реквизите «Сведения о статусном состоянии» (ipcdo:IPEntityStatusDetails): реквизит «Дата» (csdo:EventDate) заполнен; реквизит «Код статуса» (csdo:StatusCode) заполнен и его значение соответствует значению «04» – «регистрация ТЗ Союза аннулирована», атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполнен. Указанный экземпляр реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails) содержит сведения об аннулировании регистрации ТЗ Союза",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.052-T70-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 70",
          "status": "CONFIRMED",
          "page": 793,
          "table": "70",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.052.T70.REQ.3",
      "requirement_code": "3",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в случае, если в составе экземпляра реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), содержащего сведения об аннулировании регистрации ТЗ Союза, значение реквизита «Признак аннулирования товарного знака Союза» (ipsdo:CancellationStatusIndicator) хотя бы для одного экземпляра реквизита «Товар в соответствии с МКТУ» (ipcdo:GoodsBaseDetails) соответствует значению «1» – «ТЗ Союза аннулирован, решение о досрочном прекращении действия (о признание недействительным) правовой охраны в отношении товара не принято», то в электронном документе (сведениях) должен быть заполнен второй экземпляр реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), содержащий сведения о регистрации нового ТЗ Союза",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.052-T70-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 70",
          "status": "CONFIRMED",
          "page": 793,
          "table": "70",
          "version_context": "P.SP.02 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.052.T70.REQ.4",
      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в составе экземпляра реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), содержащего сведения о регистрации нового ТЗ Союза, в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPEntityStatusDetails) реквизит «Дата» (csdo:EventDate) должен быть заполнен, значение реквизита «Код статуса» (csdo:StatusCode) должно соответствовать значению «01» – «ТЗ Союза зарегистрирован», а атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.052-T70-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 70",
          "status": "CONFIRMED",
          "page": 794,
          "table": "70",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.052.T70.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "реквизит «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) в составе экземпляра реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), содержащего сведения об аннулировании регистрации ТЗ Союза, должен быть заполнен. В информационных ресурсах национального патентного ведомства, содержащих сведения о ТЗ Союза, должна содержаться запись, у которой реквизит «Код статуса» (csdo:StatusCode) равен значению «01» – «ТЗ Союза зарегистрирован» или «03» – «сведения о ТЗ Союза изменены», реквизит «Конечная дата и время» (csdo:EndDateTime) не заполнен, а значение реквизита «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) совпадает со значением реквизита «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) в составе экземпляра, содержащего сведения об аннулировании регистрации ТЗ Союза",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
