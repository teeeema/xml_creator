        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.043.T61.REQ.30",
      "requirement_code": "30",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Регистрационный номер первоначальной заявки на товарный знак Союза» (ipsdo:SourceTrademarkApplicationId) для выделенной заявки должен быть заполнен, его значение должно соответствовать значению реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) для ранее поданной заявки",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
