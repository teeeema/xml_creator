      "requirement_code": "32",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Сведения о статусном состоянии» (ipcdo:IPEntityStatusDetails) должен быть заполнен, и в его составе должны быть заполнены следующие реквизиты: для ранее поданной заявки «Код статуса» (csdo:StatusCode), и его значение должно соответствовать значению «02» – «заявка на ТЗ Союза изменена», атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполняется; для выделенной заявки «Код статуса» (csdo:StatusCode), и его значение должно соответствовать значению «01» – «новая заявка на ТЗ Союза»",
