      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "для экземпляра выделенной заявки при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Заявка на регистрацию товарного знака, знака обслуживания Евразийского экономического союза», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
