    {
      "rule_id": "P.SP.02.MSG.043.T61.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "для экземпляра выделенной заявки заявки при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Заявка на регистрацию товарного знака, знака обслуживания Евразийского экономического союза», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению: «Заявка на регистрацию товарного знака, знака обслуживания Евразийского экономического союза»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
