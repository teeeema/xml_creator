    {
      "rule_id": "P.SP.02.MSG.045.T63.REQ.31",
      "requirement_code": "31",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails), реквизит «Сведения о статусном состоянии» (ipcdo:IPEntityStatusDetails) должен быть заполнен, значение реквизита «Код статуса» (csdo:StatusCode) в его составе должно соответствовать значению «02» – «заявка на ТЗ Союза изменена», а атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.045-T63-31",
          "document": "ОП_22.pdf",
          "location": "Таблица 63",
          "status": "CONFIRMED",
          "page": 776,
          "table": "63",
          "version_context": "P.SP.02 1.0.0",
          "item": "31"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.045.T63.REQ.32",
      "requirement_code": "32",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе эреквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails), содержащего измененные сведения о заявке на ТЗ Союза, в составе реквизита «Сведения о статусном состоянии» (ipcdo: ipcdo:IPEntityStatusDetails) должны быть заполнены реквизиты: «Дата» (csdo:EventDate); «Номер документа» (csdo:DocId); «Дата поступления документа» (ipsdo:IPDocReceiptDate); «Описание» (csdo:DescriptionText)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
