      "requirement_code": "32",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "если в состав электронного документа (сведений) включен и заполнен экземпляр реквизита «Приоритет товарного знака Союза» (ipcdo:TrademarkPriorityDetails), то значение реквизита «Код вида приоритета товарного знака Союза» (ipsdo:PriorityKindCode) в его составе должно соответствовать значению кода характеристики товарного знака по приоритету из справочника основных характеристик товарного знака и знака обслуживания Евразийского экономического союза (по виду и приоритету), утвержденного Решением Коллегии Комиссии от 29 ноября 2022 г. №184",
