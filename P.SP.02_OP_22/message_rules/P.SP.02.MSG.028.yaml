      "source_text": "в составе реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) реквизит «Начальная дата и время» (csdo:StartDateTime) заполняется обязательно и соответствует дате и времени включения сведений в национальный раздел Единого реестра ТЗ Союза",
