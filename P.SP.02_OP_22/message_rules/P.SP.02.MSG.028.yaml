      ]
    },
    {
      "rule_id": "P.SP.02.MSG.028.T44.REQ.14",
      "requirement_code": "14",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в электронном документе (сведениях) «Сведения о заявке, ходатайстве для прохождения процедур регистрации ТЗ Союза» (R.IP.SP.02.002) должен быть заполнен 1 экземпляр реквизита «Участник отношений в сфере регистрации и использования прав на объекты интеллектуальной собственности» (ipcdo:IPPartyDetails), в составе которого значение реквизита «Код вида участника отношений в сфере регистрации и использования прав на объекты интеллектуальной собственности» (ipsdo:IPPartyKindCode) соответствует значению «AP» – «заявитель»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
