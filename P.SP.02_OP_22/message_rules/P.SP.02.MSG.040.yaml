{
  "message_code": "P.SP.02.MSG.040",
  "structure_id": "R.IP.SP.02.002",
  "fixed_values": {},
  "field_usage": {},
  "business_rules": [
    {
      "rule_id": "P.SP.02.MSG.040.T58.REQ.1",
      "requirement_code": "1",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.040-T58-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 58",
          "status": "CONFIRMED",
          "page": 759,
          "table": "58",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.040.T58.REQ.2",
      "requirement_code": "2",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Ходатайство о преобразовании заявки на регистрацию товарного знака, знака обслуживания Евразийского экономического союза в национальную заявку на регистрацию товарного знака, знака обслуживания», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.040-T58-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 58",
          "status": "CONFIRMED",
          "page": 759,
          "table": "58",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.040.T58.REQ.3",
      "requirement_code": "3",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Ходатайство о преобразовании заявки на регистрацию товарного знака, знака обслуживания Евразийского экономического союза в национальную заявку на регистрацию товарного знака, знака обслуживания», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению: «Ходатайство о преобразовании заявки на регистрацию товарного знака, знака обслуживания Евразийского экономического союза в национальную заявку на регистрацию товарного знака, знака обслуживания»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.040-T58-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 58",
          "status": "CONFIRMED",
          "page": 760,
          "table": "58",
          "version_context": "P.SP.02 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.040.T58.REQ.4",
      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) должен быть заполнен. В информационных ресурсах национального патентного ведомства, содержащих сведения о заявках на ТЗ Союза, должна содержаться запись, у которой реквизит «Код статуса» (csdo:StatusCode) равен значению «01» – «новая заявка на ТЗ Союза» или «02» – «заявка на ТЗ Союза изменена», реквизит «Конечная дата и время» (csdo:EndDateTime) не заполнен и в составе которой значение реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) совпадает со значением реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) в составе сообщения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.040-T58-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 58",
          "status": "CONFIRMED",
          "page": 760,
          "table": "58",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.040.T58.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Сведения о статусном состоянии» (ipcdo:IPEntityStatusDetails) должен быть заполнен, и в его составе должны быть заполнены следующие реквизиты: «Код статуса» (csdo:StatusCode), его значение должно соответствовать значению «30» – «заявка на ТЗ Союза отозвана заявителем», атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.040-T58-5",
          "document": "ОП_22.pdf",
          "location": "Таблица 58",
          "status": "CONFIRMED",
          "page": 760,
          "table": "58",
          "version_context": "P.SP.02 1.0.0",
          "item": "5"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.040.T58.REQ.6_29",
      "requirement_code": "6-29",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "соответствуют требованиям 6-29 таблицы 44 настоящего Регламента, которые применяются при заполнении экземпляра реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) (значения кодов требований в таблице 44 и таблице 58 совпадают)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.040-T58-6-29",
          "document": "ОП_22.pdf",
          "location": "Таблица 58",
          "status": "CONFIRMED",
          "page": 760,
          "table": "58",
          "version_context": "P.SP.02 1.0.0",
          "item": "6-29"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.040.T58.REQ.30",
      "requirement_code": "30",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "реквизит «Сведения о подписании документа» (ipcdo:SignatureDetails) должен быть заполнен, и в его составе если реквизит «Сотрудник организации» (ipcdo:OfficerDetails) заполнен, то реквизит «ФИО» (ccdo:FullNameDetails), непосредственно подчиненный реквизиту «Сведения о подписании документа» (ipcdo:SignatureDetails), не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.040-T58-30",
          "document": "ОП_22.pdf",
          "location": "Таблица 58",
          "status": "CONFIRMED",
          "page": 761,
          "table": "58",
          "version_context": "P.SP.02 1.0.0",
          "item": "30"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.040.T58.REQ.31",
      "requirement_code": "31",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "если в составе реквизита «Сведения о подписании документа» (ipcdo:SignatureDetails) реквизит «ФИО» (ccdo:FullNameDetails), непосредственно подчиненный реквизиту «Сведения о подписании документа» (ipcdo:SignatureDetails), заполнен, то реквизит «Сотрудник организации» (ipcdo:OfficerDetails) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.040-T58-31",
          "document": "ОП_22.pdf",
          "location": "Таблица 58",
          "status": "CONFIRMED",
          "page": 761,
          "table": "58",
          "version_context": "P.SP.02 1.0.0",
          "item": "31"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.040.T58.REQ.32",
      "requirement_code": "32",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "если в составе реквизита «Сведения о подписании документа» (ipcdo:SignatureDetails) заполнен реквизит «Сотрудник организации» (ipcdo:OfficerDetails), в его составе должны быть заполнены реквизиты «Фамилия» (csdo:LastName), «Имя» (csdo:FirstName) и «Наименование должности» (csdo:PositionName), а реквизит «Контактный реквизит» (ccdo:CommunicationDetails) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
