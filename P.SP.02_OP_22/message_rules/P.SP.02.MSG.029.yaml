      "requirement_code": "35",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) реквизит «Начальная дата и время» (csdo:StartDateTime) заполняется обязательно и соответствует дате и времени включения сведений в информационный ресурс национального патентного ведомства, содержащего сведения о заявках на ТЗ Союза",
