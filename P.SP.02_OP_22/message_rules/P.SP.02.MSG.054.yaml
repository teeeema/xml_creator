      "applies_to_structure": "R.IP.SP.03.003",
      "source_text": "в составе реквизита «Национальное патентное ведомство» (ipcdo:PatentAuthorityDetails) должен быть заполнен реквизит «Наименование уполномоченного органа» (csdo:AuthorityName)",
