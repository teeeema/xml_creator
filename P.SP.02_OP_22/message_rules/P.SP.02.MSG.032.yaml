      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Жалоба» (ipcdo:ComplaintDetails) должен быть заполнен",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
