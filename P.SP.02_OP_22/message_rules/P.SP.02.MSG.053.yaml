          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.4",
      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Заявление о продлении срока действия исключительного права на товарный знак, знак обслуживания Евразийского экономического союза», реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 798,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Заявление о продлении срока действия исключительного права на товарный знак, знак обслуживания Евразийского экономического союза», реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению «Заявление о продлении срока действия исключительного права на товарный знак, знак обслуживания Евразийского экономического союза»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
