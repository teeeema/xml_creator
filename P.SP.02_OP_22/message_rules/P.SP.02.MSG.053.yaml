{
  "message_code": "P.SP.02.MSG.053",
  "structure_id": "R.IP.SP.02.007",
  "fixed_values": {},
  "field_usage": {},
  "business_rules": [
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.1",
      "requirement_code": "1",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "реквизит «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) должен быть заполнен. В информационных ресурсах национального патентного ведомства, содержащих сведения о ТЗ Союза, должна содержаться запись, у которой реквизит «Код статуса» (csdo:StatusCode) равен значению «01» – «ТЗ Союза зарегистрирован» или «03» – «сведения о ТЗ Союза изменены», реквизит «Конечная дата и время» (csdo:EndDateTime) не заполнен, а значение реквизита «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) совпадает со значением реквизита «Регистрационный номер товарного знака Союза» в составе сообщения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 798,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.2",
      "requirement_code": "2",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 798,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.3",
      "requirement_code": "3",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в составе реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails) реквизит «Конечная дата и время» (csdo:EndDateTime) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 798,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.4",
      "requirement_code": "4",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Заявление о продлении срока действия исключительного права на товарный знак, знак обслуживания Евразийского экономического союза», реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 798,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.5",
      "requirement_code": "5",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Заявление о продлении срока действия исключительного права на товарный знак, знак обслуживания Евразийского экономического союза», реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению «Заявление о продлении срока действия исключительного права на товарный знак, знак обслуживания Евразийского экономического союза»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-5",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 799,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "5"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.6_19",
      "requirement_code": "6-19",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "соответствуют требованиям 6-19 таблицы 49 настоящего Регламента, которые применяются при заполнении экземпляра реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails) (значения кодов требований в таблице 49 и таблице 71 совпадают)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-6-19",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 799,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "6-19"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.20",
      "requirement_code": "20",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в составе реквизита «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails) в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPEntityStatusDetails) реквизит «Дата» (csdo:EventDate) должен быть заполнен, значение реквизита «Код статуса» (csdo:StatusCode) должно соответствовать значению «03» – «сведения о ТЗ Союза изменены», а атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-20",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 799,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "20"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.21",
      "requirement_code": "21",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в информационных ресурсах национального патентного ведомства, содержащих сведения о ТЗ Союза, должна содержаться запись, у которой значение реквизита «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) совпадает со значением реквизита «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) в составе сообщения и количество экземпляров реквизита «Дата истечения срока действия документа» (csdo:DocValidityDate), непосредственно подчиненного реквизиту «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), должно быть на один экземпляр меньше, чем количество реквизитов «Дата истечения срока действия документа» (csdo:DocValidityDate), непосредственно подчиненного реквизиту «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails)в составе сообщения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-21",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 799,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "21"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.22",
      "requirement_code": "22",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "в составе записи в информационных ресурсах национального патентного ведомства, содержащих сведения о ТЗ Союза, у которой значение реквизита «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId) совпадает со значением реквизита «Регистрационный номер товарного знака Союза» (ipsdo:TrademarkId), значения реквизитов «Дата истечения срока действия документа» (csdo:DocValidityDate), непосредственно подчиненных реквизиту «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails) должны совпадать со значениями реквизитов «Дата истечения срока действия документа» (csdo:DocValidityDate), непосредственно подчиненных реквизиту «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails)в составе сообщения за исключением одного значения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-22",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 800,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "22"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.23",
      "requirement_code": "23",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "значение реквизита «Дата истечения срока действия документа» (csdo:DocValidityDate), непосредственно подчиненного реквизиту «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails), для которого не найдено соответствия в составе экземпляров реквизита «Дата истечения срока действия документа» (csdo:DocValidityDate), непосредственно подчиненных реквизиту «Сведения записи Единого реестра ТЗ Союза» (ipcdo:UnifiedRegisterRecordsDetails) в составе информационных ресурсах национального патентного ведомства, содержащих сведения о ТЗ Союза, должно быть больше, чем значения остальных реквизитов «Дата истечения срока действия документа» (csdo:DocValidityDate), непосредственно подчиненных реквизиту «Сведения записи Единого реестра ТЗ Союза» в составе сообщения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-23",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 800,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "23"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.24",
      "requirement_code": "24",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "реквизит «Сведения о подписании документа» (ipcdo:SignatureDetails) должен быть заполнен, и в его составе если реквизит «Сотрудник организации» (ipcdo:OfficerDetails) заполнен, то реквизит «ФИО» (ccdo:FullNameDetails), непосредственно подчиненный реквизиту «Сведения о подписании документа» (ipcdo:SignatureDetails), не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.053-T71-24",
          "document": "ОП_22.pdf",
          "location": "Таблица 71",
          "status": "CONFIRMED",
          "page": 800,
          "table": "71",
          "version_context": "P.SP.02 1.0.0",
          "item": "24"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.053.T71.REQ.25",
      "requirement_code": "25",
      "applies_to_structure": "R.IP.SP.02.007",
      "source_text": "если в составе реквизита «Сведения о подписании документа» (ipcdo:SignatureDetails) реквизит «ФИО» (ccdo:FullNameDetails), непосредственно подчиненный реквизиту «Сведения о подписании документа» (ipcdo:SignatureDetails), заполнен, то реквизит «Сотрудник организации» (ipcdo:OfficerDetails) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
