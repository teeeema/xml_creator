    },
    {
      "rule_id": "P.SP.02.MSG.004.REQ.31",
      "requirement_code": "31",
      "source_text": "в составе реквизита «Сведения об обращении заинтересованного лица о несоответствии обозначения, заявленного на регистрацию в качестве товарного знака Союза, требованиям Договора о товарных знаках» (ipcdo:TrademarkClaimDetails) должны быть заполнены следующие реквизиты: «Заинтересованное лицо» (ipcdo:StakeholderDetails); «Регистрационный номер обращения заинтересованного лица» (ipsdo:RequestId); «Дата обращения заинтересованного лица» (ipsdo:RequestDate); «Описание несоответствия» (ipsdo:InconsistencyText)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.004-31",
          "document": "ОП_22.pdf",
          "location": "Таблица 38. Требования к электронному документу (сведениям) P.SP.02.MSG.004",
          "status": "CONFIRMED",
          "page": 533,
          "table": "38",
          "version_context": "P.SP.02 1.0.0",
          "item": "31"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.004.REQ.32",
      "requirement_code": "32",
      "source_text": "в составе реквизита «Заинтересованное лицо» (ipcdo:StakeholderDetails) должны быть заполнены следующие реквизиты: «Код страны» (csdo:UnifiedCountryCode); «Наименование субъекта» (csdo:SubjectName); «Краткое наименование субъекта» (csdo:SubjectBriefName); «Адрес» (ccdo:SubjectAddressDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
