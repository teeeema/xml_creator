      "requirement_code": "6-29",
      "source_text": "соответствуют требованиям 6-29 таблицы 34 настоящего Регламента, которые применяются при заполнении экземпляра реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) (значения кодов требований в таблице 34 и таблице 38 совпадают)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.004-6-29",
          "document": "ОП_22.pdf",
          "location": "Таблица 38. Требования к электронному документу (сведениям) P.SP.02.MSG.004",
