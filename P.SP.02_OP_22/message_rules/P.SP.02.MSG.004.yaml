          "location": "Таблица 38. Требования к электронному документу (сведениям) P.SP.02.MSG.004",
          "status": "CONFIRMED",
          "page": 531,
          "table": "38",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.004.REQ.2",
      "requirement_code": "2",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Обращение заинтересованного лица о наличии оснований для отказа в регистрации товарного знака Союза, предусмотренных статьей 8 Договора о товарных знаках, знаках обслуживания и наименованиях мест происхождения товаров Евразийского экономического союза от 3 февраля 2020 года», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.004-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 38. Требования к электронному документу (сведениям) P.SP.02.MSG.004",
          "status": "CONFIRMED",
          "page": 532,
          "table": "38",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.004.REQ.3",
      "requirement_code": "3",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Обращение заинтересованного лица о наличии оснований для отказа в регистрации товарного знака Союза, предусмотренных статьей 8 Договора о товарных знаках, знаках обслуживания и наименованиях мест происхождения товаров Евразийского экономического союза от 3 февраля 2020 года», в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению: «Обращение заинтересованного лица о наличии оснований для отказа в регистрации товарного знака Союза, предусмотренных статьей 8 Договора о товарных знаках, знаках обслуживания и наименованиях мест происхождения товаров Евразийского экономического союза от 3 февраля 2020 года»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.004-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 38. Требования к электронному документу (сведениям) P.SP.02.MSG.004",
          "status": "CONFIRMED",
          "page": 532,
          "table": "38",
          "version_context": "P.SP.02 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.004.REQ.4",
      "requirement_code": "4",
      "source_text": "реквизит «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) должен быть заполнен. В информационных ресурсах Комиссии, содержащих сведения о заявках на ТЗ Союза, должна содержаться запись, у которой значение реквизита «Код статуса» (csdo:StatusCode) соответствует значениям «01» – «новая заявка на ТЗ Союза» или «02» – «заявка на ТЗ Союза изменена», в составе которой значение реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) совпадает со значением реквизита «Регистрационный номер заявки на товарный знак Союза» (ipsdo:TrademarkApplicationId) в составе сообщения",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.004-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 38. Требования к электронному документу (сведениям) P.SP.02.MSG.004",
          "status": "CONFIRMED",
          "page": 532,
          "table": "38",
          "version_context": "P.SP.02 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.004.REQ.5",
      "requirement_code": "5",
      "source_text": "реквизит «Сведения о подписании документа» (ipcdo:SignatureDetails) не заполняется",
