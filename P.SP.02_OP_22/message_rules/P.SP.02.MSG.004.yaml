      "source_text": "в составе реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails) реквизиты: «Национальная заявка на регистрацию товарного знака» (ipcdo:TrademarkNationalApplicationDetails), «Сведения об изменении заявителя» (ipcdo:ApplicantChangeDetails), «Жалоба» (ipcdo:ComplaintDetails), «Ответ на жалобу заявителя на решение национального патентного ведомства» (ipcdo:ApplicantComplainResponseDetails), «Сведения о доводах (замечаниях) заявителя» (ipcdo:ArgumentDetails) не заполняются",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
