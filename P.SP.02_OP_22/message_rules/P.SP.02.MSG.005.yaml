    {
      "rule_id": "P.SP.02.MSG.005.T39.REQ.1",
      "requirement_code": "1",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» (ipcdo:TrademarkApplicationDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.005-T39-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 39. Требования к электронному документу (сведениям) P.SP.02.MSG.005",
          "status": "CONFIRMED",
          "page": 535,
          "table": "39",
          "version_context": "P.SP.02 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.005.T39.REQ.2",
      "requirement_code": "2",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Доводы заявителя в отношении обращения заинтересованного лица о наличии оснований для отказа в регистрации товарного знака, знака обслуживания Евразийского экономического союза, предусмотренных статьей 8 Договора о товарных знаках, знаках обслуживания и наименованиях мест происхождения товаров Евразийского экономического союза от 3 февраля 2020 года», реквизит ipsdo:IPDocKindCode должен быть заполнен кодовым обозначением указанного вида документа, а ipsdo:IPDocKindName не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.005-T39-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 39. Требования к электронному документу (сведениям) P.SP.02.MSG.005",
          "status": "CONFIRMED",
          "page": 535,
          "table": "39",
          "version_context": "P.SP.02 1.0.0",
          "item": "2"
        }
      ]
    },
    {
