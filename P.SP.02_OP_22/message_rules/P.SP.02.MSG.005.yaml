      "requirement_code": "3",
      "source_text": "при отсутствии указанного вида документа в классификаторе ipsdo:IPDocKindCode не заполняется, а ipsdo:IPDocKindName должен быть заполнен наименованием «Доводы заявителя в отношении обращения заинтересованного лица о наличии оснований для отказа в регистрации товарного знака, знака обслуживания Евразийского экономического союза, предусмотренных статьей 8 Договора о товарных знаках, знаках обслуживания и наименованиях мест происхождения товаров Евразийского экономического союза от 3 февраля 2020 года»",
