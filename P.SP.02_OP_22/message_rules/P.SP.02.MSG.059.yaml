      "source_text": "электронный документ (сведения) «Обобщенная структура электронного документа (сведений)» (R.010) должен включать в себя один экземпляр электронного документа (сведений) «Сведения о заявке, ходатайстве для прохождения процедур регистрации ТЗ Союза» (R.IP.SP.02.002) либо один экземпляр электронного документа (сведений) «Сведения о ТЗ Союза из Единого реестра ТЗ Союза» (R.IP.SP.02.007)",
