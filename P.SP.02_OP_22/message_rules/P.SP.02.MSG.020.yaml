  "business_rules": [
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.1",
      "requirement_code": "1",
      "source_text": "Должны быть заполнены 1 или 2 экземпляра ipcdo:UnifiedRegisterRecordsDetails.",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.020-T53-1",
          "document": "ОП_22.pdf",
          "location": "Таблица 53",
          "status": "CONFIRMED",
          "page": 569,
          "table": "53",
          "item": "1",
          "version_context": "P.SP.02 1.0.0"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.2",
      "requirement_code": "2",
      "source_text": "Один экземпляр должен содержать сведения об аннулировании: EventDate заполнен, StatusCode = «04», codeListId не заполнен.",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.020-T53-2",
          "document": "ОП_22.pdf",
          "location": "Таблица 53",
          "status": "CONFIRMED",
          "page": 569,
          "table": "53",
          "item": "2",
          "version_context": "P.SP.02 1.0.0"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.3",
      "requirement_code": "3",
      "source_text": "Если CancellationStatusIndicator хотя бы для одного GoodsBaseDetails = «1», должен быть второй экземпляр с регистрацией нового ТЗ Союза.",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.020-T53-3",
          "document": "ОП_22.pdf",
          "location": "Таблица 53",
          "status": "CONFIRMED",
          "page": 569,
          "table": "53",
          "item": "3",
          "version_context": "P.SP.02 1.0.0"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.4",
      "requirement_code": "4",
      "source_text": "Для нового ТЗ Союза EventDate заполнен, StatusCode = «01», codeListId не заполняется.",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.020-T53-4",
          "document": "ОП_22.pdf",
          "location": "Таблица 53",
          "status": "CONFIRMED",
          "page": 570,
          "table": "53",
          "item": "4",
          "version_context": "P.SP.02 1.0.0"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.5",
      "requirement_code": "5",
      "source_text": "TrademarkId аннулируемой регистрации обязателен и должен соответствовать активной записи реестра со статусом «01» или «03».",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.020-T53-5",
          "document": "ОП_22.pdf",
          "location": "Таблица 53",
          "status": "CONFIRMED",
          "page": 570,
          "table": "53",
          "item": "5",
          "version_context": "P.SP.02 1.0.0"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.6_19",
      "requirement_code": "6-19",
      "source_text": "Соответствуют требованиям 6-19 таблицы 37; коды требований совпадают.",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.020-T53-6-19",
