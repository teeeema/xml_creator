    },
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.20",
      "requirement_code": "20",
      "source_text": "TrademarkId нового ТЗ Союза обязателен; записи с таким TrademarkId в реестре быть не должно.",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.020-T53-20",
          "document": "ОП_22.pdf",
          "location": "Таблица 53",
          "status": "CONFIRMED",
          "page": 570,
          "table": "53",
          "item": "20",
          "version_context": "P.SP.02 1.0.0"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.21",
      "requirement_code": "21",
      "source_text": "StartDateTime аннулируемой записи должен быть меньше StartDateTime записи нового ТЗ Союза.",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.020-T53-21",
          "document": "ОП_22.pdf",
          "location": "Таблица 53",
          "status": "CONFIRMED",
          "page": 571,
          "table": "53",
          "item": "21",
          "version_context": "P.SP.02 1.0.0"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.22",
      "requirement_code": "22",
      "source_text": "EndDateTime аннулируемой записи обязателен, больше ее StartDateTime и меньше StartDateTime нового ТЗ Союза.",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "22OP-RULE-P.SP.02.MSG.020-T53-22",
