          "version_context": "P.SP.02 1.0.0"
        }
      ]
    },
    {
      "rule_id": "P.SP.02.MSG.020.T53.REQ.23",
      "requirement_code": "23",
      "source_text": "В ipcdo:RegistrationCancellationDetails обязательны ipsdo:CancellationRegistrationTrademarkCode и ipsdo:SolutionCancellationRegistrationTrademarkCode.",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
