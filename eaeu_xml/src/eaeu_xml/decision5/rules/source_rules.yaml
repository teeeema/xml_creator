rules:
  - {rule_id: D5-NS-SOAP, entity: soap namespace, condition: always, status: CONFIRMED, description: SOAP 1.2 namespace, source_document: Решение №5, source_paragraph: "пункт 18, таблица 1", notes: null}
  - {rule_id: D5-NS-WSA, entity: wsa namespace, condition: always, status: CONFIRMED, description: WS-Addressing namespace, source_document: Решение №5, source_paragraph: "пункт 18, таблица 1", notes: null}
  - {rule_id: D5-NS-INT, entity: int namespace, condition: always, status: CONFIRMED, description: Interaction namespace, source_document: Решение №5, source_paragraph: "пункт 18, таблица 1", notes: null}
  - {rule_id: D5-XML-ENVELOPE, entity: soap:Envelope, condition: SOAP message, status: CONFIRMED, description: Сообщение состоит из Header и Body и использует UTF-8., source_document: Решение №5, source_paragraph: "пункты 19 и 26", notes: null}
  - {rule_id: D5-HDR-TO, entity: wsa:To, condition: APPLICATION, status: CONFIRMED, description: Обязательный логический адрес фактического получателя., source_document: Решение №5, source_paragraph: "пункт 30", notes: null}
  - {rule_id: D5-HDR-APP-REPLYTO, entity: wsa:ReplyTo, condition: APPLICATION общего процесса, status: CONFIRMED, description: wsa:Address содержит логический адрес отправителя, на который направляется ответ., source_document: Решение №5, source_paragraph: "пункты 32, 34, 58 и 62", notes: Обязательность является совместным следствием указанных пунктов.}
  - {rule_id: D5-HDR-APP-FROM, entity: wsa:From, condition: APPLICATION общего процесса, status: CONFIRMED, description: Не должен формироваться., source_document: Решение №5, source_paragraph: "пункт 58", notes: null}
  - {rule_id: D5-HDR-APP-FAULTTO, entity: wsa:FaultTo, condition: APPLICATION общего процесса, status: CONFIRMED, description: Не должен формироваться., source_document: Решение №5, source_paragraph: "пункт 58", notes: null}
  - {rule_id: D5-ID-MESSAGE, entity: wsa:MessageID, condition: every message, status: CONFIRMED, description: Обязательный глобально уникальный UUID; приложение показывает urn:uuid URI., source_document: Решение №5, source_paragraph: "пункт 36 и приложение №3", notes: null}
  - {rule_id: D5-ACTION-APPLICATION, entity: wsa:Action, condition: APPLICATION общего процесса, status: CONFIRMED, description: URI int://CP/process/version/procedure/transaction/message., source_document: Решение №5, source_paragraph: "пункты 38, 59 и 60", notes: null}
  - {rule_id: D5-ID-PROCEDURE, entity: int:ProcedureID, condition: APPLICATION общего процесса, status: CONFIRMED, description: Неизменяемая цепочка UUID компонентов для вложенных процедур., source_document: Решение №5, source_paragraph: "пункт 39, таблица 3 и приложение №3", notes: Компоненты сериализуются как urn:uuid URI согласно примеру.}
  - {rule_id: D5-ID-CONVERSATION, entity: int:ConversationID, condition: transaction instance, status: CONFIRMED, description: Уникальный UUID экземпляра транзакции., source_document: Решение №5, source_paragraph: "пункт 40, таблица 4 и приложение №3", notes: null}
  - {rule_id: D5-HDR-INTEGRATION, entity: int:Integration, condition: any message handled by integration platform, status: CONFIRMED, description: Формируется только компонентами интеграционной платформы., source_document: Решение №5, source_paragraph: "пункты 41–44", notes: Header field is absent before platform receipt and platform-generated thereafter.}
  - {rule_id: D5-ADDR-FORMAT, entity: LogicalAddress, condition: always, status: CONFIRMED, description: Префикс EAEU:// и компоненты через /., source_document: Решение №5, source_paragraph: "пункты 45–47", notes: null}
  - {rule_id: D5-ADDR-SEGMENT, entity: address segment, condition: always, status: CONFIRMED, description: EEC либо ISO 3166-1 alpha-2 syntax., source_document: Решение №5, source_paragraph: "пункт 48, таблица 6", notes: Membership государств не проверяется.}
  - {rule_id: D5-ADDR-SPACE, entity: address space, condition: always, status: CONFIRMED, description: Пространства CP, CA и SR., source_document: Решение №5, source_paragraph: "пункт 49", notes: null}
  - {rule_id: D5-ADDR-CP, entity: CP participant id, condition: CP, status: CONFIRMED, description: EAEU://segment/CP/process-code/participant-code[/authority-identifier]., source_document: Решение №5, source_paragraph: "пункты 50–53", notes: Process participant code определяется правилами конкретного общего процесса; optional authority identifier не выводится из segment.}
  - {rule_id: D5-ADDR-SR-GATE, entity: SR participant id, condition: integration gateway, status: CONFIRMED, description: Идентификатор gate подтвержден., source_document: Решение №5, source_paragraph: "пункт 56", notes: Остальные SR identifiers не верифицируются.}
  - {rule_id: D5-CORR-INITIAL, entity: wsa:RelatesTo, condition: transaction initial message, status: CONFIRMED, description: В инициирующем сообщении не заполняется., source_document: Решение №5, source_paragraph: "пункт 102", notes: Следует из исключения для сообщения, инициирующего транзакцию.}
  - {rule_id: D5-CORR-FOLLOWUP, entity: wsa:RelatesTo, condition: non-initial common-process message, status: CONFIRMED, description: Содержит MessageID сообщения полученного участником на предыдущем этапе; текущее сообщение получает новый MessageID., source_document: Решение №5, source_paragraph: "пункты 37 и 102", notes: Correlation source is transition-specific rather than list adjacency.}
  - {rule_id: D5-BODY-EXTERNAL, entity: soap:Body, condition: APPLICATION общего процесса, status: CONFIRMED, description: Состав прикладных данных задается технологическими документами конкретного процесса., source_document: Решение №5, source_paragraph: "пункт 63", notes: Body конкретного общего процесса находится во внешнем process package.}
  - {rule_id: D5-INTEGRATION-STRUCTURE, entity: int:Integration, message_kind: ANY, condition: platform processing, status: CONFIRMED, who_generates: integration platform, source_of_value: platform, description: TrackID and AcceptTime each occur once., source_document: Решение №5, source_paragraph: "пункты 41–42, таблица 5", implemented_by: IntegrationMetadata, tests: test_platform_integration, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-INTEGRATION-TRACK, entity: int:TrackID, message_kind: ANY, condition: Integration present, status: CONFIRMED, who_generates: integration platform, source_of_value: platform receive event, description: Unique RFC4122 UUID represented as xs:anyURI and unchanged in platform., source_document: Решение №5, source_paragraph: "пункт 43", implemented_by: TrackId, tests: test_platform_integration, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-INTEGRATION-TIME, entity: int:AcceptTime, message_kind: ANY, condition: Integration present, status: CONFIRMED, who_generates: integration platform, source_of_value: platform receive time, description: UTC receive time with timezone and unchanged in platform., source_document: Решение №5, source_paragraph: "пункт 44", implemented_by: AcceptTime, tests: test_platform_integration, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-SIGNAL-RCV, entity: P.MSG.RCV, message_kind: SIGNAL, condition: structural body control complete, status: CONFIRMED, who_generates: receiver, source_of_value: transaction stage, description: Получено confirmation., source_document: Решение №5, source_paragraph: "пункты 113–114", implemented_by: SignalFactory, tests: test_signal_messages, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-SIGNAL-PRS, entity: P.MSG.PRS, message_kind: SIGNAL, condition: before application body processing, status: CONFIRMED, who_generates: receiver, source_of_value: transaction stage, description: Принято в обработку confirmation., source_document: Решение №5, source_paragraph: "пункты 113 и 115", implemented_by: SignalFactory, tests: test_signal_messages, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-SIGNAL-ERR, entity: P.MSG.ERR, message_kind: SIGNAL, condition: unexpected or validation/fatal processing error, status: CONFIRMED, who_generates: receiver, source_of_value: processing result, description: Ошибка exception signal., source_document: Решение №5, source_paragraph: "пункты 116–121", implemented_by: SignalPayload, tests: test_error_signal_codes, confirmation_status: CONFIRMED, notes: Format-logical error code comes from process regulation.}
  - {rule_id: D5-SIGNAL-ACTION, entity: wsa:Action, message_kind: SIGNAL, condition: signal message, status: CONFIRMED, who_generates: receiver, source_of_value: source Action context plus signal code, description: Signal action keeps application Action components with P.MSG code., source_document: Решение №5, source_paragraph: "пункты 114, 115 и 121", implemented_by: SignalAction, tests: test_signal_messages, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-SIGNAL-BODY, entity: signal body, message_kind: SIGNAL, condition: signal message, status: CONFIRMED, who_generates: receiver, source_of_value: processing stage and validation result, description: DeliveryReceipt ProcessingReceipt and ValidationError with SignalId DateTime and typed Error entries., source_document: Решение №5, source_paragraph: "приложение №5, таблицы 1–5", implemented_by: SignalPayload, tests: test_signal_messages and test_error_signal_codes, confirmation_status: CONFIRMED, notes: Signal namespace is urn:EEC:signal:v1.0.}
  - {rule_id: D5-FAULT-TO, entity: wsa:To, message_kind: TECHNICAL_FAULT, condition: fault generation, status: CONFIRMED, who_generates: fault sender, source_of_value: source FaultTo else ReplyTo, description: Fault destination derivation., source_document: Решение №5, source_paragraph: "пункт 66", implemented_by: FaultFactory, tests: test_fault_header_and_attributes, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-FAULT-CORRELATION, entity: wsa:RelatesTo, message_kind: TECHNICAL_FAULT, condition: fault generation, status: CONFIRMED, who_generates: fault sender, source_of_value: source MessageID and Action, description: RelatesAction is an int attribute equal to source Action., source_document: Решение №5, source_paragraph: "пункт 68", implemented_by: FaultFactory, tests: test_fault_header_and_attributes, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-FAULT-HEADER, entity: ReplyTo/FaultTo, message_kind: TECHNICAL_FAULT, condition: fault generation, status: CONFIRMED, who_generates: fault sender, source_of_value: none, description: ReplyTo and FaultTo are forbidden in Fault., source_document: Решение №5, source_paragraph: "пункт 69", implemented_by: FaultFactory, tests: test_fault_header_and_attributes, confirmation_status: CONFIRMED, notes: From identifies sender per paragraph 67.}
  - {rule_id: D5-FAULT-ACTION, entity: wsa:Action, message_kind: TECHNICAL_FAULT, condition: fault type, status: CONFIRMED, who_generates: fault sender, source_of_value: finite normative URI, description: Distinct WS-A and other technological Fault actions., source_document: Решение №5, source_paragraph: "пункт 70", implemented_by: FaultAction, tests: test_fault_actions, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-FAULT-BODY, entity: soap:Fault, message_kind: TECHNICAL_FAULT, condition: fault, status: CONFIRMED, who_generates: fault sender, source_of_value: failure, description: SOAP 1.2 Code Subcode Reason and optional Detail., source_document: Решение №5, source_paragraph: "пункт 72, таблица 7", implemented_by: SoapFault, tests: test_fault_header_and_attributes, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-FAULT-CODES, entity: soap:Subcode, message_kind: TECHNICAL_FAULT, condition: fault, status: CONFIRMED, who_generates: fault sender, source_of_value: failure category, description: Finite technological code table and Sender/Receiver mapping., source_document: Решение №5, source_paragraph: "пункт 74, таблица 8", implemented_by: FaultSubcode, tests: test_fault_code_mapping, confirmation_status: CONFIRMED, notes: DuplicateMessageID and RetryAfter exclusions preserved.}
  - {rule_id: D5-FAULT-REASON, entity: soap:Text, message_kind: TECHNICAL_FAULT, condition: fault, status: CONFIRMED, who_generates: fault sender, source_of_value: localized reason, description: Unique xml:lang values and mandatory ru reason., source_document: Решение №5, source_paragraph: "пункт 75", implemented_by: SoapFault, tests: test_fault_requires_russian_reason, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-FAULT-DETAIL, entity: int:ProblemMessage, message_kind: TECHNICAL_FAULT, condition: optional detail, status: CONFIRMED, who_generates: fault sender, source_of_value: source XML, description: Optional problematic source message serialized as string content., source_document: Решение №5, source_paragraph: "пункт 76", implemented_by: ProblemMessage, tests: test_fault_reason_and_problem_message, confirmation_status: VERIFIED_RECOMMENDATION, notes: CDATA is recommended rather than mandatory; escaped text has the same parsed string value.}
  - {rule_id: D5-TRN-PARAMETERS, entity: TransactionParameters, message_kind: APPLICATION/SIGNAL, condition: transaction definition, status: CONFIRMED, who_generates: process specification, source_of_value: technological documents, description: Three optional timeouts and retry count., source_document: Решение №5, source_paragraph: "пункты 104–110", implemented_by: TransactionParameters, tests: test_transaction_parameters, confirmation_status: CONFIRMED, notes: No real timers.}
  - {rule_id: D5-TRN-RETRY, entity: retry, message_kind: APPLICATION, condition: expected message absent or fault and retries remain, status: CONFIRMED, who_generates: sender, source_of_value: timeout/event, description: Resend uses new MessageID and same transaction instance., source_document: Решение №5, source_paragraph: "пункты 100, 105–110", implemented_by: RetryService, tests: test_retry_metadata, confirmation_status: CONFIRMED, notes: Payload copying remains caller responsibility.}
  - {rule_id: D5-TRN-MUTUAL, entity: Взаимные обязательства, message_kind: APPLICATION/SIGNAL, condition: pattern selected, status: CONFIRMED, who_generates: participants, source_of_value: transaction definition, description: Bidirectional RCV and PRS with rollback semantics., source_document: Решение №5, source_paragraph: "пункты 122–124", implemented_by: TransactionStateMachine, tests: test_all_pattern_start_states, confirmation_status: CONFIRMED, notes: Database rollback not implemented.}
  - {rule_id: D5-TRN-QUESTION, entity: Вопрос/ответ, message_kind: APPLICATION, condition: pattern selected, status: CONFIRMED, who_generates: participants, source_of_value: transaction definition, description: Immediate request and response., source_document: Решение №5, source_paragraph: "пункты 125–126", implemented_by: TransactionStateMachine, tests: test_all_pattern_start_states, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-TRN-REQUEST, entity: Запрос/ответ, message_kind: APPLICATION/SIGNAL, condition: pattern selected, status: CONFIRMED, who_generates: participants, source_of_value: transaction definition, description: Dynamic response with optional guaranteed delivery., source_document: Решение №5, source_paragraph: "пункты 127–130", implemented_by: TransactionStateMachine, tests: test_guaranteed_request_response, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-TRN-CONFIRMATION, entity: Запрос/подтверждение, message_kind: APPLICATION/SIGNAL, condition: pattern selected, status: CONFIRMED, who_generates: participants, source_of_value: transaction definition, description: Response may require RCV confirmation., source_document: Решение №5, source_paragraph: "пункты 131–135", implemented_by: TransactionStateMachine, tests: test_all_pattern_start_states, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-TRN-NOTIFICATION, entity: Оповещение, message_kind: APPLICATION/SIGNAL, condition: pattern selected, status: CONFIRMED, who_generates: participants, source_of_value: transaction definition, description: Notification requires RCV., source_document: Решение №5, source_paragraph: "пункты 136–137", implemented_by: TransactionStateMachine, tests: test_all_pattern_start_states, confirmation_status: CONFIRMED, notes: null}
  - {rule_id: D5-TRN-DISTRIBUTION, entity: Распространение информации, message_kind: APPLICATION, condition: pattern selected, status: CONFIRMED, who_generates: initiator, source_of_value: transaction definition, description: Complete after notification send without response or confirmation., source_document: Решение №5, source_paragraph: "пункты 138–139", implemented_by: TransactionStateMachine, tests: test_all_pattern_start_states, confirmation_status: CONFIRMED, notes: ERR or Fault still possible.}
