[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaeu-xml"
version = "0.4.0"
description = "ГИС_xml — универсальный движок для явных пакетов общих процессов"
requires-python = ">=3.11"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
eaeu-xml-gui = "eaeu_xml.gui_qt.app:main"

[tool.setuptools.package-data]
"eaeu_xml.gui_qt" = ["qml/**/*.qml", "qml/**/qmldir"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
