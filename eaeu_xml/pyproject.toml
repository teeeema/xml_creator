[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaeu-xml"
version = "0.4.0"
description = "Universal EAEU XML engine with explicit external process packages"
requires-python = ">=3.11"

[project.optional-dependencies]
gui = ["wxPython>=4.2"]

[project.scripts]
eaeu-xml-gui = "eaeu_xml.gui.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
