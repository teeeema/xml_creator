      "source_text": "реквизит «Сведения о пошлине за осуществление юридически значимых действий» (ipcdo:IPPaymentDetails) должен быть заполнен, в его составе реквизиты «Банковский счет» (ccdo:BankAccountDetails) и «Счет в платежной системе» (ccdo:PaymentSystemAccountDetails) не заполняются",
