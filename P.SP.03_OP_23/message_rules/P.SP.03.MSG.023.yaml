          "version_context": "P.SP.03 1.0.0",
          "item": "7"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.023.REQ.003",
      "requirement_code": "8",
      "source_text": "в составе реквизита «Сведения о пошлине за осуществление юридически значимых действий» (ipcdo:IPPaymentDetails) реквизиты «Дата и время» (csdo:EventDateTime), «Участник отношений в сфере регистрации и использования прав на объекты интеллектуальной собственности» (ipcdo:IPPartyDetails) и «Прилагаемый документ» (ipcdo:AccompanyingDocumentsDetails) должны быть заполнены",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "23OP-RULE-P.SP.03.MSG.023-8",
          "document": "ОП_23.pdf",
          "location": "Таблица 27. Требования к электронному документу (сведениям) P.SP.03.MSG.023",
          "status": "CONFIRMED",
          "page": 284,
          "table": "27",
          "version_context": "P.SP.03 1.0.0",
          "item": "8"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.023.REQ.004",
      "requirement_code": "9",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Участник отношений в сфере регистрации и использования прав на объекты интеллектуальной собственности» (ipcdo:IPPartyDetails), в составе которого значение реквизита «Код вида участника отношений в сфере регистрации и использования прав на объекты интеллектуальной собственности» (ipsdo:IPPartyKindCode) должно соответствовать одному из следующих значений: «AP» – «заявитель», «PA» – «представитель заявителя, являющийся патентным поверенным» или «RE» – «представитель заявителя, не являющийся патентным поверенным»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "23OP-RULE-P.SP.03.MSG.023-9",
          "document": "ОП_23.pdf",
          "location": "Таблица 27. Требования к электронному документу (сведениям) P.SP.03.MSG.023",
          "status": "CONFIRMED",
          "page": 284,
          "table": "27",
          "version_context": "P.SP.03 1.0.0",
          "item": "9"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.023.REQ.005",
      "requirement_code": "10",
      "source_text": "в составе реквизита «Участник отношений в сфере регистрации и использования прав на объекты интеллектуальной собственности» (ipcdo:IPPartyDetails) должны быть заполнены реквизиты: «Код страны» (csdo:UnifiedCountryCode); «Полное наименование субъекта c указанием вида представления сведений и кода языка» (ipsdo:IPSubjectName)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "23OP-RULE-P.SP.03.MSG.023-10",
