      "requirement_code": "3-31",
      "source_text": "соответствуют требованиям 3-31 таблицы 20 настоящего Регламента, которые которые применяются при заполнении экземпляров реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) (значения кодов требований в таблице 20 и таблице 22 совпадают)",
