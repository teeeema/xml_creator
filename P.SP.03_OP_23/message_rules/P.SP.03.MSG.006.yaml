      "source_text": "если в экземплярах реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) значение реквизита «Код вида записи общего информационного ресурса» (ipsdo:ResourceItemKindCode) соответствует значению «RH» – «сведения о праве использования НМПТ Союза», то в составе таких экземпляров реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) реквизит «НМПТ Союза» (ipcdo:ApellationOfOriginDetails) должен быть заполнен, в его составе должны быть заполнены реквизиты: «Регистрационный номер НМПТ Союза» (ipsdo:ApellationOfOriginEAEUId); «Указание товара, в отношении которого осуществляется регистрация и (или) предоставление права использования НМПТ» (ipsdo:ApellationOfOriginGoodsText); «Описание особого свойства товара» (ipsdo:GoodsPropertiesDescriptionText); «Описание географического объекта или его границ» (ipsdo:GeographicRegionDescriptionText)",
