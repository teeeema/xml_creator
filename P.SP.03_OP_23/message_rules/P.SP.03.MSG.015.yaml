      "source_text": "если в составе электронного документа (сведений) заполнено несколько экземпляров реквизита «Прилагаемый документ» (ipcdo:AccompanyingDocumentsDetails) и значение реквизита «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) совпадает в составе некоторых из таких экземпляров, в составе всех таких экземпляров реквизита «Прилагаемый документ» (ipcdo:AccompanyingDocumentsDetails) должен быть заполнен как минимум один из следующих реквизитов: «Наименование документа» (csdo:DocName), «Номер документа» (csdo:DocId), «Дата документа» (csdo:DocCreationDate), и значения как минимум одного из перечисленных реквизитов в составе всех экземпляров реквизита «Прилагаемый документ» (ipcdo:AccompanyingDocumentsDetails) должны отличаться",
