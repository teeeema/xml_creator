      "source_text": "если в составе электронного документа (сведений) заполнен 1 или несколько экземпляров реквизита «Прилагаемый документ» (ipcdo:AccompanyingDocumentsDetails), то если в составе таких экземпляров «Прилагаемый документ» (ipcdo:AccompanyingDocumentsDetails) значение реквизита «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) соответствует значению «05999», «06999», «07030», «07180», «07185», «99025» или «99999», то реквизит «Наименование документа» (csdo:DocName) должен быть заполнен",
