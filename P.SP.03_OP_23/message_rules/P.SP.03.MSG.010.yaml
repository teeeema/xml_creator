    {
      "rule_id": "P.SP.03.MSG.010.REQ.006",
      "requirement_code": "52",
      "source_text": "в составе экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащего измененные сведения о заявке на НМПТ Союза, реквизит «Сведения о статусном состоянии» (ipcdo:IPStatusDetails) должен быть заполнен, значение реквизита «Код статуса» (csdo:StatusCode) в его составе должно соответствовать значению «02» – «изменена», а атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
