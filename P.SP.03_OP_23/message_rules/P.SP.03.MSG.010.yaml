    {
      "rule_id": "P.SP.03.MSG.010.REQ.007",
      "requirement_code": "53",
      "source_text": "при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Ходатайство о внесении изменений в заявку на регистрацию и (или) предоставление права использования наименования места происхождения товара Евразийского экономического союза», в составе экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащего измененные сведения о заявке на НМПТ Союза, в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPStatusDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение указанного вида документа, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
