  "business_rules": [
    {
      "rule_id": "P.SP.03.MSG.010.REQ.001",
      "requirement_code": "1",
      "source_text": "в электронном документе (сведениях) должно быть заполнено 2 экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащих соответственно изменяемые и измененные сведения о заявке на НМПТ Союза, в составе которых должны совпадать значения реквизитов: «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) (в случае заполнения этого реквизита в экземплярах реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails)); «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) (в случае заполнения этого реквизита в экземплярах реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails)); «Номер документа» (csdo:DocId); «Дата поступления документа» (ipsdo:IPDocReceiptDate); «Дата подачи заявки» (ipsdo:ApplicationReceiptDate); «Регистрационный номер заявки на НМПТ Союза» (ipsdo:ApellationOfOriginApplicationId); «Код страны» (csdo:UnifiedCountryCode) в составе реквизита «Национальное патентное ведомство» (ipcdo:PatentAuthorityDetails); «Наименование обозначения НМПТ» (ipsdo:ApellationOfOriginName); «Регистрационный номер НМПТ Союза»; (ipsdo:ApellationOfOriginEAEUId) (в случае заполнения этого реквизита в экземплярах реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "23OP-RULE-P.SP.03.MSG.010-1",
          "document": "ОП_23.pdf",
          "location": "Таблица 19. Требования к электронному документу (сведениям) P.SP.03.MSG.010",
          "status": "CONFIRMED",
          "page": 233,
          "table": "19",
          "version_context": "P.SP.03 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.010.REQ.002",
      "requirement_code": "2",
      "source_text": "в информационных ресурсах национального патентного ведомства, содержащих сведения о заявках на НМПТ Союза, должна содержаться запись, в составе которой реквизит «Код статуса» (csdo:StatusCode) равен значению «01» – «новая» или «02» – «изменена», реквизит «Конечная дата и время» (csdo:EndDateTime) не заполнен, и в составе которой совокупность значений реквизитов «Регистрационный номер заявки на НМПТ Союза» (ipsdo:ApellationOfOriginApplicationId), «Код статуса» (csdo:StatusCode) и «Начальная дата и время» (csdo:StartDateTime) совпадает с совокупностью значений соответствующих реквизитов в представляемых изменяемых сведениях о заявке на НМПТ Союза",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "23OP-RULE-P.SP.03.MSG.010-2",
          "document": "ОП_23.pdf",
          "location": "Таблица 19. Требования к электронному документу (сведениям) P.SP.03.MSG.010",
          "status": "CONFIRMED",
          "page": 234,
          "table": "19",
          "version_context": "P.SP.03 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.010.REQ.003",
      "requirement_code": "3",
      "source_text": "в составе экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащего изменяемые сведения о заявке на НМПТ Союза, реквизит «Конечная дата и время» (csdo:EndDateTime) должен быть заполнен, и значение этого реквизита должно быть больше значения реквизита «Начальная дата и время» (csdo:StartDateTime) в составе этого экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails) и меньше значения реквизита «Начальная дата и время» (csdo:StartDateTime) в составе экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащего измененные сведения о заявке на НМПТ Союза",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "23OP-RULE-P.SP.03.MSG.010-3",
          "document": "ОП_23.pdf",
          "location": "Таблица 19. Требования к электронному документу (сведениям) P.SP.03.MSG.010",
          "status": "CONFIRMED",
          "page": 234,
          "table": "19",
          "version_context": "P.SP.03 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.010.REQ.004",
      "requirement_code": "4-50",
      "source_text": "соответствуют требованиям 4-50 таблицы 18 настоящего Регламента, которые применяются при заполнении экземпляров реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащих соответственно изменяемые и измененные сведения о заявке на НМПТ Союза (значения кодов требований в таблице 18 и таблице 19 совпадают)",
