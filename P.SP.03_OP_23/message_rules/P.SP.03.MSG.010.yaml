          "page": 235,
          "table": "19",
          "version_context": "P.SP.03 1.0.0",
          "item": "53"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.010.REQ.008",
      "requirement_code": "54",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Ходатайство о внесении изменений в заявку на регистрацию и (или) предоставление права использования наименования места происхождения товара Евразийского экономического союза», в составе экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащего измененные сведения о заявке на НМПТ Союза, в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPStatusDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению «Ходатайство о внесении изменений в заявку на регистрацию и (или) предоставление права использования наименования места происхождения товара Евразийского экономического союза»",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
