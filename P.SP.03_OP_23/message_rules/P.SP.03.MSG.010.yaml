    {
      "rule_id": "P.SP.03.MSG.010.REQ.001",
      "requirement_code": "1",
      "source_text": "в электронном документе (сведениях) должно быть заполнено 2 экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащих соответственно изменяемые и измененные сведения о заявке на НМПТ Союза, в составе которых должны совпадать значения реквизитов: «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) (в случае заполнения этого реквизита в экземплярах реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails)); «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) (в случае заполнения этого реквизита в экземплярах реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails)); «Номер документа» (csdo:DocId); «Дата поступления документа» (ipsdo:IPDocReceiptDate); «Дата подачи заявки» (ipsdo:ApplicationReceiptDate); «Регистрационный номер заявки на НМПТ Союза» (ipsdo:ApellationOfOriginApplicationId); «Код страны» (csdo:UnifiedCountryCode) в составе реквизита «Национальное патентное ведомство» (ipcdo:PatentAuthorityDetails); «Наименование обозначения НМПТ» (ipsdo:ApellationOfOriginName); «Регистрационный номер НМПТ Союза»; (ipsdo:ApellationOfOriginEAEUId) (в случае заполнения этого реквизита в экземплярах реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails)",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
