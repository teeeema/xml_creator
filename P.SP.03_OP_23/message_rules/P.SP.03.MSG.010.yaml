      "source_text": "в составе экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащего изменяемые сведения о заявке на НМПТ Союза, реквизит «Конечная дата и время» (csdo:EndDateTime) должен быть заполнен, и значение этого реквизита должно быть больше значения реквизита «Начальная дата и время» (csdo:StartDateTime) в составе этого экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails) и меньше значения реквизита «Начальная дата и время» (csdo:StartDateTime) в составе экземпляра реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails), содержащего измененные сведения о заявке на НМПТ Союза",
