    {
      "rule_id": "P.SP.03.MSG.010.REQ.002",
      "requirement_code": "2",
      "source_text": "в информационных ресурсах национального патентного ведомства, содержащих сведения о заявках на НМПТ Союза, должна содержаться запись, в составе которой реквизит «Код статуса» (csdo:StatusCode) равен значению «01» – «новая» или «02» – «изменена», реквизит «Конечная дата и время» (csdo:EndDateTime) не заполнен, и в составе которой совокупность значений реквизитов «Регистрационный номер заявки на НМПТ Союза» (ipsdo:ApellationOfOriginApplicationId), «Код статуса» (csdo:StatusCode) и «Начальная дата и время» (csdo:StartDateTime) совпадает с совокупностью значений соответствующих реквизитов в представляемых изменяемых сведениях о заявке на НМПТ Союза",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
