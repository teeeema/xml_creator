    {
      "rule_id": "P.SP.03.MSG.013.REQ.045",
      "requirement_code": "45",
      "source_text": "если в экземплярах реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) значение реквизита «Код вида записи общего информационного ресурса» (ipsdo:ResourceItemKindCode) соответствует значению «AO» – «сведения о НМПТ Союза», и если в составе таких экземпляров реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) заполнен один или несколько экземпляров реквизита «Сведения о национальной регистрации НМПТ» (ipcdo:ApellationOfOriginNationalRegistrationDetails), то в составе таких экземпляров реквизита «Сведения о национальной регистрации НМПТ» (ipcdo:ApellationOfOriginNationalRegistrationDetails) значения реквизита «Код страны» (csdo:UnifiedCountryCode) не должно совпадать, должен быть заполнен реквизит «Регистрационный номер НМПТ в национальном реестре НМПТ» (ipsdo:ApellationOfOriginNationalId), а остальные реквизиты в составе реквизита «Сведения о национальной регистрации НМПТ» (ipcdo:ApellationOfOriginNationalRegistrationDetails) не заполняются",
