    {
      "rule_id": "P.SP.03.MSG.013.REQ.046",
      "requirement_code": "46",
      "source_text": "если в экземплярах реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) значение реквизита «Код вида записи общего информационного ресурса» (ipsdo:ResourceItemKindCode) соответствует значению «AO» – «сведения о НМПТ Союза» и, если в составе таких экземпляров реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) заполнен один или несколько экземпляров реквизита «Сведения о национальной регистрации НМПТ» (ipcdo:ApellationOfOriginNationalRegistrationDetails), то в информационных ресурсах национального патентного ведомства, содержащих сведения о НМПТ, зарегистрированных до вступления в силу Договора, должна содержаться запись, в составе которой значение реквизита «Код вида записи общего информационного ресурса» (ipsdo:ResourceItemKindCode) соответствует значению «AN» – «сведения о национальном НМПТ», «Код статуса» (csdo:StatusCode) соответствует значению «21» – «НМПТ Союза зарегистрировано», реквизит «Конечная дата и время» (csdo:EndDateTime) в составе реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) не заполнен, а совокупность значений реквизитов «Код страны» (csdo:UnifiedCountryCode) и «Регистрационный номер НМПТ в национальном реестре НМПТ» (ipsdo:ApellationOfOriginNationalId) и в составе реквизита «Сведения о национальной регистрации НМПТ» (ipcdo:ApellationOfOriginNationalRegistrationDetails) совпадает со значением соответствующих реквизитов в представляемых сведениях",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
