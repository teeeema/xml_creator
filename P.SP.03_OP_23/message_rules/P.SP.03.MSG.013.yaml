      "source_text": "если в экземплярах реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) значение реквизита «Код вида записи общего информационного ресурса» (ipsdo:ResourceItemKindCode) соответствует значению «AO» – «сведения о НМПТ Союза», в информационных ресурсах национального патентного ведомства, содержащих сведения Единого реестра НМПТ Союза, должна содержаться запись, в составе которой значение реквизита «Код вида записи общего информационного ресурса» (ipsdo:ResourceItemKindCode) соответствует значению «AO» – «сведения о НМПТ Союза», а значение совокупности реквизитов «Регистрационный номер НМПТ Союза» (ipsdo:ApellationOfOriginEAEUId), «Наименование обозначения НМПТ» (ipsdo:ApellationOfOriginName), «Код статуса» (csdo:StatusCode) и «Начальная дата и время» (csdo:StartDateTime) совпадает со значением совокупности соответствующих реквизитов в представляемых изменяемых сведениях Единого реестра НМПТ Союза, а реквизит «Конечная дата и время» (csdo:EndDateTime) в составе реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) не заполнен",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
