      "source_text": "если в экземплярах реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) значение реквизита «Код вида записи общего информационного ресурса» (ipsdo:ResourceItemKindCode) соответствует значению «AO» – «сведения о НМПТ Союза», то в составе таких экземпляров реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) при заполнении в составе реквизита «НМПТ Союза» (ipcdo:ApellationOfOriginDetails) дополнительных по отношению к описанному в требовании № 42 настоящей таблицы экземпляров реквизита «Наименование обозначения НМПТ» (ipsdo:ApellationOfOriginName), в составе таких экземпляров реквизита «Наименование обозначения НМПТ» (ipsdo:ApellationOfOriginName) значение атрибута «код вида представления наименования» (атрибут nameRepresentationKindCode) должно соответствовать значению «CY» – «транслитерация сведений на исходном (оригинальном) языке буквами кириллического алфавита» или «TR» – «перевод сведений с исходного (оригинального) языка» и атрибут «код языка» (атрибут languageCode) не заполняется",
