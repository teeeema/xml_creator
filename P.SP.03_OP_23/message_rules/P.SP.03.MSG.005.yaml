    {
      "rule_id": "P.SP.03.MSG.005.REQ.009",
      "requirement_code": "50",
      "source_text": "если значение реквизита «Код статуса» (csdo:StatusCode) соответствует значению «20» – «отказ», при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Решение об отказе в регистрации наименования места происхождения товара Евразийского экономического союза и (или) в предоставлении права использования наименования места происхождения товара Евразийского экономического союза», в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPStatusDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению «Решение об отказе в регистрации НМПТ Союза и (или) и в предоставлении права использования НМПТ Союза»",
