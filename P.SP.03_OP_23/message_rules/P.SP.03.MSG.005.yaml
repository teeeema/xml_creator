      "source_text": "если значение реквизита «Код статуса» (csdo:StatusCode) соответствует значению «20» – «отказ», при включении в классификатор видов документов, сведений и материалов значения, соответствующего виду документа «Решение об отказе в регистрации наименования места происхождения товара Евразийского экономического союза и (или) в предоставлении права использования наименования места происхождения товара Евразийского экономического союза», в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPStatusDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение одного из перечисленных видов документов, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
