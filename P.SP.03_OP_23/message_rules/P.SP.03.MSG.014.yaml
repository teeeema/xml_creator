    {
      "rule_id": "P.SP.03.MSG.014.REQ.007",
      "requirement_code": "38",
      "source_text": "в составе экземпляра реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails), содержащего измененные сведения Единого реестра НМПТ Союза, при отсутствии в классификаторе видов документов, сведений и материалов значения, соответствующего виду документа «Заявление о продлении срока действия свидетельства о праве использования наименования места происхождения товара Евразийского экономического союза», в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPStatusDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать значению «Заявление о продлении срока действия свидетельства о праве использования наименования места происхождения товара Евразийского экономического союза»",
