      "rule_id": "P.SP.03.MSG.009.REQ.001",
      "requirement_code": "1",
      "source_text": "в электронном документе (сведениях) должен быть заполнен 1 экземпляр реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails)",
