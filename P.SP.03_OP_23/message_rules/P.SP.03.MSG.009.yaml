          "version_context": "P.SP.03 1.0.0",
          "item": "1"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.009.REQ.002",
      "requirement_code": "2",
      "source_text": "в составе реквизита «Сведения о статусном состоянии» (ipcdo:IPStatusDetails) должен быть заполнен реквизит «Дата» (csdo:EventDate), значение реквизита «Код статуса» (csdo:StatusCode) должно соответствовать значению «01» – «новая», атрибут «идентификатор справочника (классификатора)» (атрибут codeListId) в составе реквизита «Код статуса» (csdo:StatusCode) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "23OP-RULE-P.SP.03.MSG.009-2",
          "document": "ОП_23.pdf",
          "location": "Таблица 18. Требования к электронному документу (сведениям) P.SP.03.MSG.009",
          "status": "CONFIRMED",
          "page": 221,
          "table": "18",
          "version_context": "P.SP.03 1.0.0",
          "item": "2"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.009.REQ.003",
      "requirement_code": "3",
      "source_text": "в информационных ресурсах национального патентного ведомства, содержащих сведения о заявках на НМПТ Союза, не должно содержаться записи, в составе которой значение реквизита «Регистрационный номер заявки на НМПТ Союза» (ipsdo:ApellationOfOriginApplicationId) совпадает со значением реквизита «Регистрационный номер заявки на НМПТ Союза» (ipsdo:ApellationOfOriginApplicationId) в представляемых сведениях, реквизит «Код статуса» (csdo:StatusCode) равен значению «01» – «новая» или «02» – «изменена», а реквизит «Конечная дата и время» (csdo:EndDateTime) в составе реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "23OP-RULE-P.SP.03.MSG.009-3",
          "document": "ОП_23.pdf",
          "location": "Таблица 18. Требования к электронному документу (сведениям) P.SP.03.MSG.009",
          "status": "CONFIRMED",
          "page": 221,
          "table": "18",
          "version_context": "P.SP.03 1.0.0",
          "item": "3"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.009.REQ.004",
      "requirement_code": "4",
      "source_text": "при включении в классификатор видов документов, сведений и материалов, используемых в сфере интеллектуальной собственности, утвержденный Решением Коллегии Комиссии от 27 июля 2021 г. № 92 (далее – классификатор видов документов, сведений и материалов), значений, соответствующих видам документов «Заявка на регистрацию и предоставление права использования наименования места происхождения товара Евразийского экономического союза», «Заявка на предоставление права использования зарегистрированного наименования места происхождения товара Евразийского экономического союза» или «Ходатайство о выдаче свидетельства о праве использования наименования места происхождения товара Евразийского экономического союза в отношении наименования места происхождения товара, зарегистрированного до вступления в силу Договора о товарных знаках, знаках обслуживания и наименованиях мест происхождения товаров Евразийского экономического союза от 3 февраля 2020 года» в составе реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) должен быть заполнен и должен содержать кодовое обозначение одного из перечисленных видов документов, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) не заполняется",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
      "interpretation_status": "CAPTURED_NOT_MACHINE_MAPPED",
      "source_refs": [
        {
          "source_id": "23OP-RULE-P.SP.03.MSG.009-4",
          "document": "ОП_23.pdf",
          "location": "Таблица 18. Требования к электронному документу (сведениям) P.SP.03.MSG.009",
          "status": "CONFIRMED",
          "page": 221,
          "table": "18",
          "version_context": "P.SP.03 1.0.0",
          "item": "4"
        }
      ]
    },
    {
      "rule_id": "P.SP.03.MSG.009.REQ.005",
      "requirement_code": "5",
      "source_text": "при отсутствии в классификаторе видов документов, сведений и материалов значений, соответствующих видам документов «Заявка на регистрацию и предоставление права использования наименования места происхождения товара Евразийского экономического союза», «Заявка на предоставление права использования зарегистрированного наименования места происхождения товара Евразийского экономического союза» или «Ходатайство о выдаче свидетельства о праве использования наименования места происхождения товара Евразийского экономического союза в отношении наименования места происхождения товара, зарегистрированного до вступления в силу Договора о товарных знаках, знаках обслуживания и наименованиях мест происхождения товаров Евразийского экономического союза от 3 февраля 2020 года», в составе реквизита «Заявка на НМПТ Союза (ходатайство, свидетельство)» (ipcdo:ApellationOfOriginApplicationDetails) реквизит «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode) не заполняется, а реквизит «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) должен быть заполнен, и его значение должно соответствовать одному из следующих значений: «Заявка на регистрацию и предоставление права использования наименования места происхождения товара Евразийского экономического союза», «Заявка на предоставление права использования зарегистрированного наименования места происхождения товара Евразийского экономического союза» или «Ходатайство о выдаче свидетельства о праве использования наименования места происхождения товара Евразийского экономического союза в отношении наименования места происхождения товара, зарегистрированного до вступления в силу Договора о товарных знаках, знаках обслуживания и наименованиях мест происхождения товаров Евразийского экономического союза от 3 февраля 2020 года»",
