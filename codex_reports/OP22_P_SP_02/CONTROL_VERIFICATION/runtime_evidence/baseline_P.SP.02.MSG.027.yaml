      "requirement_code": "30",
      "applies_to_structure": "R.IP.SP.02.002",
      "source_text": "в составе реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) реквизит «Конечная дата и время» (csdo:EndDateTime) заполняется обязательно",
      "classification": "DECLARATIVE_NOT_YET_EXECUTABLE",
