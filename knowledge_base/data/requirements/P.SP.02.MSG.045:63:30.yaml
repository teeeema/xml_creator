    "source_text": "если значение реквизита «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode), «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) в составе реквизита реквизита «Заявка на товарный знак Союза (ходатайство, жалоба)» соответствует значению «Ходатайство о внесении в заявку на регистрацию товарного знака, знака обслуживания Евразийского экономического союза изменений, касающихся сведений о заявителе и связанных с передачей или переходом права на заявку на регистрацию товарного знака, знака обслуживания Евразийского экономического союза», а значение реквизита «Код вида участника отношений в сфере регистрации и использования прав на объекты интеллектуальной собственности» (ipsdo:IPPartyKindCode) соответствует значению значению «AS» – «правопреемник» то в составе реквизита «Прилагаемый документ» (ipcdo:AccompanyingDocumentsDetails) должна быть хотя бы одна запись, у которой значения реквизитов «Код вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindCode), «Наименование вида документа, используемого в сфере интеллектуальной собственности» (ipsdo:IPDocKindName) соответствуют значению вида документа «Другой документ о передаче (переходе) права на заявку на товарный знак (знак обслуживания) Евразийского экономического союза»"
