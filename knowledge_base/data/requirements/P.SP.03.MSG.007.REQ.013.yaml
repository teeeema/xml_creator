    "source_text": "если в экземплярах реквизита «Сведения записи Единого реестра НМПТ Союза» (ipcdo:ApellationOfOriginRegisterItemDetails) значение реквизита «Код вида записи общего информационного ресурса» (ipsdo:ResourceItemKindCode) соответствует значению «RH» – «сведения о праве использования НМПТ Союза», то в информационных ресурсах Комиссии, содержащих сведения Единого реестра НМПТ Союза, должна содержаться запись, в составе которой значение реквизита «Код вида записи общего информационного ресурса» (ipsdo:ResourceItemKindCode) соответствует значению «AO» – «сведения о НМПТ Союза», значение реквизита «Регистрационный номер НМПТ Союза» (ipsdo:ApellationOfOriginEAEUId) совпадает со значением соответствующего реквизита в представляемых сведениях, реквизит «Код статуса» (csdo:StatusCode) соответствует значению «01» – «НМПТ Союза зарегистрировано» или «02» – «сведения о НМПТ Союза изменены», а реквизит «Конечная дата и время» (csdo:EndDateTime) в составе реквизита «Технологические характеристики записи общего ресурса» (ccdo:ResourceItemStatusDetails) не заполнен Inherited semantic requirement 13 from P.SP.03.MSG.006 as stated by range 3-31 in P.SP.03.MSG.007."
