    "source_text": "Если реквизит «Сведения о регистрационном удостове рении на лекарственный препарат» (hccdo:DrugRegistrationCertificateDetails) заполнен, и значение реквизита . «Код роли государства-члена» (hcsdo:CountryKindCode) соответствует референтному государству, то в общем реестре должны присутсвовать сведения, для которых значения реквизитов «Номер заявления о регистрации лекарственного препарата» (hcsdo:ApplicationId), «Код страны (csdo:UnifiedCountryCode)» в составе реквизита «Сведения о регистрации лекарственного препарата в государстве-члене» (hccdo:DrugCountryRegistrationDetails) совпадают с переданными, а также заполнен реквизит «Документ в формате PDF» (hcsdo:Pdf BinaryText)в составе следующих сложных реквизитов: «Сведения об инструкции по медицинскому применению лекарственного препарата» (hccdo:DrugUsageInstructionDetails), «Сведения об общей характеристике лекарственного препарата» (hccdo:DrugGeneral CharacteristicDetails), «Сведения о макете упаковки лекарственного препарата» (hccdo:DrugPackageLayoutDetails), «Сведения об итоговом экспертном отчете» (hccdo:ExpertReportDetails), «Сведения о нормативном документе по качеству лекарственного препарата» (hccdo:QualityRegulatoryDocDetails)"
