    "source_text": "реквизит «Код вида документа регистрационного дела на лекарственный препарат» (hcsdo:DrugRegistrationFileCode) может принимать одно из следующих значений: 0101 – Запрос о предоставлении недостающей дополнительной информации, необходимых разъяснений или уточнений документов и данных, представленных в регистрационном досье лекарственного препарата; 0102 – Запрос государства признания в отношении документов регистрационного досье лекарственного препарата; 0103 – Замечания к регистрационному досье лекарственного препарата от государства признания; 0104 – Ответ на запрос о предоставлении недостающей дополнительной информации, необходимых разъяснений или уточнений документов и данных, представленных в регистрационном досье лекарственного препарата; 0105 – Запрос о предоставлении копии мастер-файла системы фармаконадзора; 0106 – Ответ заявителя на запрос государства признания в отношении документов регистрационного досье лекарственного препарата; 0107 – Ответ заявителя на замечания от государства признания; 0199 – Другое; 0403 – Запрос уполномоченного органа (экспертной организации) государства признания, направленный в уполномоченный орган референтного государства; 0405 – Замечания государства признания в отношении заключительного экспертного отчета по качеству; 0406 – Предложение уполномоченного органа (экспертной организации) государства признания в отношении заключительного экспертного отчета по качеству, направленное в уполномоченный орган референтного государства »;"
